AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Helmut OP-30 — verwalteter Auftrags-Transport (Amazon SQS + Lambda) in eu-central-1.
  ÜBERPRÜFBARE INFRASTRUKTURDEFINITION — in diesem Sprint NICHT ausgerollt.
  Supabase bleibt die Wahrheit über Aufträge; SQS trägt ausschließlich Wecksignale
  ({jobId, schemaVersion}), Lambda ist ausschließlich der Verbraucher. Beide sind
  austauschbar, ohne den Fachkern anzufassen.

# ═══════════════════════════════════════════════════════════════════════════════════════════
# BEWUSSTE GRENZE DIESES SPRINTS
# Diese Vorlage wurde NICHT auf ein AWS-Konto angewendet. Es existiert keine Queue, keine
# Lambda-Funktion, keine IAM-Rolle und kein KMS-Schlüssel. Das Anlegen ist eine
# kostenpflichtige Gründerentscheidung (Belegdatei §19.6). Die Vorlage ist trotzdem
# vollständig und wird durch `scripts/infrastruktur-definition-test.js` gegen die
# Zusagen der Architektur geprüft — eine stille Abweichung (zu kurze Sichtbarkeitszeit,
# fehlende Verschlüsselung, unbegrenzte Parallelität, fehlende Quarantäne) fällt auf.
# ═══════════════════════════════════════════════════════════════════════════════════════════

Parameters:
  Umgebung:
    Type: String
    Default: production
    AllowedValues: [production, staging]
    Description: Trennt Queues und Funktionen je Umgebung; sie teilen sich nie eine Queue.

  MaxParallelitaet:
    Type: Number
    Default: 4
    MinValue: 1
    MaxValue: 20
    Description: >-
      Reservierte Lambda-Parallelität = harte Obergrenze gleichzeitiger Verbraucher.
      Default 4 passt zur Stufe 200 des Stufenplans. Der Wert ist bewusst klein: die
      eigentliche Schutzgrenze liegt in der Datenbank (Klasse worker-drain), diese hier
      verhindert, dass AWS überhaupt mehr Verbraucher startet, als Supabase Free trägt.

  SupabaseUrlParameter:
    Type: String
    Default: /helmut/production/supabase-url
    Description: >-
      Name des SSM-Parameters mit der Supabase-URL. Es steht KEIN Secret in dieser Vorlage
      und keines in einer Lambda-Umgebungsvariablen im Klartext.

  SupabaseSchluesselParameter:
    Type: String
    Default: /helmut/production/supabase-service-role-key
    Description: Name des SecureString-SSM-Parameters mit dem service_role-Schlüssel.

  PaketBucket:
    Type: String
    Description: >-
      S3-Bucket mit dem gebauten Lambda-Archiv (helmut-lambda.zip). Der Bucket MUSS in
      eu-central-1 liegen — AWS verlangt, dass Lambda-Code aus derselben Region kommt.

  PaketSchluessel:
    Type: String
    Default: helmut-lambda.zip
    Description: S3-Objektschlüssel des gebauten Archivs (Integritätsnachweis siehe manifest.json).

# ── SCHUTZ GEGEN EINE BEREITSTELLUNG AUSSERHALB VON eu-central-1 ─────────────────────────────
# Datenresidenz ist keine Konfigurationsfrage, die still danebengehen darf. Diese Bedingung
# lässt den Stack in jeder anderen Region SOFORT scheitern (CloudFormation wertet Conditions
# vor dem Anlegen aus) — statt eine Queue in Virginia anzulegen und es niemandem zu sagen.
Conditions:
  IstFrankfurt: !Equals [!Ref 'AWS::Region', 'eu-central-1']

Resources:

  # HINWEIS ZUR EHRLICHKEIT: diese Ressource ist DOKUMENTATION, nicht der Riegel. Ein
  # `AWS::NoValue` in einem Metadata-Feld lässt einen Stack NICHT scheitern. Der wirksame
  # Riegel sitzt an der Pflichteigenschaft `KeyPolicy` des KMS-Schlüssels (siehe dort).
  RegionsRiegel:
    Type: AWS::CloudFormation::WaitConditionHandle
    Metadata:
      Zweck: >-
        Datenresidenz-Riegel. Der Stack ist ausschliesslich fuer eu-central-1 (Frankfurt)
        bestimmt; die Bedingung IstFrankfurt muss wahr sein.
      RegionGeprueft: !If [IstFrankfurt, 'eu-central-1', !Ref 'AWS::NoValue']

  # ── VERSCHLÜSSELUNG ────────────────────────────────────────────────────────────────────────
  # Serverseitige Verschlüsselung mit einem EIGENEN KMS-Schlüssel (nicht dem AWS-eigenen):
  # nur so ist der Zugriff über eine Schlüsselrichtlinie prüfbar und entziehbar.
  AuftragsQueueSchluessel:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub 'Helmut ${Umgebung}: Verschluesselung der Auftrags-Wecksignale'
      EnableKeyRotation: true
      # DATENRESIDENZ-RIEGEL (der WIRKSAME): `KeyPolicy` ist eine PFLICHT-Eigenschaft eines
      # KMS-Schlüssels. Außerhalb von eu-central-1 löst `!If` den Zweig `AWS::NoValue` aus,
      # die Pflichteigenschaft fehlt und das Anlegen des Schlüssels scheitert SOFORT. Weil
      # beide Queues über `KmsMasterKeyId` von diesem Schlüssel abhängen, entsteht in einer
      # falschen Region KEINE Queue — der Stack bricht vorher ab.
      # NACHWEIS OFFEN: das ist CloudFormation-Standardverhalten (fehlende Pflichteigenschaft
      # = Validierungsfehler), aber in dieser Umgebung nicht gegen AWS geprüft. Vor dem
      # ersten Ausrollen einmal in einer falschen Region trocken anlegen und das Scheitern
      # belegen (Runbook §AWS).
      KeyPolicy: !If
        - IstFrankfurt
        - Version: '2012-10-17'
          Statement:
            - Sid: KontoVerwaltung
              Effect: Allow
              Principal:
                AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
              Action: 'kms:*'
              Resource: '*'
        - !Ref 'AWS::NoValue'

  # ── SCHLÜSSEL FÜR DIE SUPABASE-ZUGANGSDATEN (Verkabelungslauf 2026-08-14/4) ────────────────
  # WARUM EIN ZWEITER SCHLÜSSEL UND NICHT DER OBIGE:
  # Der Queue-Schlüssel wird vom SenderBenutzer benutzt — einem IAM-Benutzer mit langlebigen
  # Zugangsdaten, die AUSSERHALB von AWS bei Vercel liegen. Er trägt darauf (korrekterweise,
  # als Produzent) `kms:GenerateDataKey` UND `kms:Decrypt`. Schützte derselbe Schlüssel auch
  # die SecureString-Parameter, hätte dieser Benutzer die kryptographische Fähigkeit, den
  # Supabase-service_role-Schlüssel zu entschlüsseln — den Generalschlüssel, der RLS umgeht
  # und alle Mandanten trägt (CLAUDE.md §4 Regel 1). Dass er es heute nicht kann, liegt nur
  # an einer IAM-Hürde (ihm fehlt ssm:GetParameter), nicht an der Kryptographie.
  # Ein Schlüssel für Wecksignale ({jobId, schemaVersion}) und ein Schlüssel für
  # Mandantengeheimnisse dürfen nicht derselbe sein. Kosten: ein zweiter KMS-Schlüssel.
  ParameterSchluessel:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub 'Helmut ${Umgebung}: Verschluesselung der Supabase-SecureString-Parameter'
      EnableKeyRotation: true
      # Derselbe Datenresidenz-Riegel wie oben (Pflichteigenschaft entfällt außerhalb Frankfurts).
      KeyPolicy: !If
        - IstFrankfurt
        - Version: '2012-10-17'
          Statement:
            - Sid: KontoVerwaltung
              Effect: Allow
              Principal:
                AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
              Action: 'kms:*'
              Resource: '*'
            # AUSDRÜCKLICH, NICHT NUR ÜBER IAM: ob die Konto-Anweisung oben allein genügt,
            # damit IAM-Identitätsrichtlinien für diesen Schlüssel greifen, konnte in dieser
            # Umgebung NICHT an der offiziellen Quelle geprüft werden (docs.aws.amazon.com ist
            # durch den Egress-Proxy gesperrt). Diese Anweisung nennt die beiden Rollen
            # deshalb selbst — damit trägt die Lösung unter beiden möglichen Antworten.
            # Die Rollen-ARNs entstehen per !Sub aus den fest vergebenen RoleName-Werten,
            # NICHT per !GetAtt: sonst entstünde ein wechselseitiger Bezug (die Rollen
            # verweisen ihrerseits auf diesen Schlüssel).
            - Sid: NurDieBeidenLambdaRollenEntschluesseln
              Effect: Allow
              Principal:
                AWS:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/helmut-auftrags-verbraucher-${Umgebung}'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/helmut-outbox-relay-${Umgebung}'
              Action: 'kms:Decrypt'
              Resource: '*'
              Condition:
                StringEquals:
                  # NUR über den Parameter Store, nie direkt. Dasselbe Muster benutzt AWS für
                  # seine eigenen verwalteten Schlüssel: "All AWS managed keys use a
                  # kms:ViaService condition key in their key policy document."
                  # (AWS KMS Developer Guide, conditions-kms — Quellen: Belegdatei §25.)
                  'kms:ViaService': !Sub 'ssm.${AWS::Region}.amazonaws.com'
        - !Ref 'AWS::NoValue'

  # BEDIENALIAS — ausschließlich für den Betreiber beim Anlegen der Parameter
  # (`aws ssm put-parameter --key-id alias/helmut-ssm-<umgebung> ...`).
  # ER GEHÖRT NIEMALS IN EIN `Resource`-FELD: eine Alias-ARN bezeichnet den Alias, nicht den
  # Schlüssel (Belegdatei §25). Genau dieser Fehler wurde hier korrigiert.
  ParameterSchluesselAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/helmut-ssm-${Umgebung}'
      TargetKeyId: !Ref ParameterSchluessel

  # ── QUARANTÄNE (Dead-Letter-Queue) ─────────────────────────────────────────────────────────
  # Eine Nachricht, die dauerhaft nicht verarbeitet werden kann, landet hier — statt endlos
  # zu kreisen oder still zu verschwinden. 14 Tage Aufbewahrung, damit ein Betreiber sie
  # tatsächlich noch ansehen kann.
  AuftragsQuarantaene:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'helmut-auftraege-quarantaene-${Umgebung}'
      MessageRetentionPeriod: 1209600        # 14 Tage (Maximum)
      KmsMasterKeyId: !Ref AuftragsQueueSchluessel
      KmsDataKeyReusePeriodSeconds: 300
      Tags:
        - Key: helmut:zweck
          Value: auftrags-quarantaene

  # ── HAUPTQUEUE ─────────────────────────────────────────────────────────────────────────────
  AuftragsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'helmut-auftraege-${Umgebung}'
      # SICHTBARKEITSZEIT > MAXIMALE BEARBEITUNGSDAUER.
      # Der Verbraucher deckelt einen Auftrag auf 120 s (queue-verbraucher.js
      # VERBRAUCHER_BUDGET_MS) und die Lambda-Funktion auf 180 s (Timeout unten).
      # 360 s = doppelte Lambda-Laufzeit: eine noch laufende Verarbeitung kann NIE
      # gleichzeitig ein zweites Mal zugestellt werden.
      VisibilityTimeout: 360
      MessageRetentionPeriod: 345600         # 4 Tage — deutlich über jedem Cron-Rückfallzyklus
      ReceiveMessageWaitTimeSeconds: 20      # Long Polling: weniger leere Abfragen, weniger Kosten
      KmsMasterKeyId: !Ref AuftragsQueueSchluessel
      KmsDataKeyReusePeriodSeconds: 300
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AuftragsQuarantaene.Arn
        # BEGRENZTE ZUSTELLVERSUCHE: nach 5 erfolglosen Zustellungen ist die Nachricht
        # dauerhaft problematisch und geht in die Quarantäne. Der Wert liegt bewusst unter
        # der Versuchsgrenze des Auftragsbuchs (max_attempts 5–10), damit die Queue nie
        # länger kreist als der Auftrag selbst Versuche hat.
        maxReceiveCount: 5
      Tags:
        - Key: helmut:zweck
          Value: auftrags-wecksignale

  # ── IAM: MINIMALE RECHTE FÜR DEN SENDER (Vercel) ───────────────────────────────────────────
  # Der Sender darf GENAU EINES: eine Nachricht in GENAU DIESE Queue legen. Kein Empfangen,
  # kein Löschen, kein Purge, keine Attributänderung, keine zweite Queue.
  SenderBenutzer:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub 'helmut-auftrags-sender-${Umgebung}'
      Policies:
        - PolicyName: nur-senden
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'sqs:SendMessage'
                Resource: !GetAtt AuftragsQueue.Arn
              - Effect: Allow
                Action:
                  # PRODUZENTENRECHTE (korrigiert 2026-08-14/3): ein Sender an eine mit
                  # kundeneigenem KMS-Schlüssel verschlüsselte SQS-Queue braucht
                  # `kms:GenerateDataKey` UND `kms:Decrypt` — Decrypt, weil SQS den
                  # verschlüsselten Datenschlüssel im Namen des Aufrufers entschlüsselt.
                  # `kms:Encrypt` allein genügt NICHT und wird nicht benötigt.
                  - 'kms:GenerateDataKey'
                  - 'kms:Decrypt'
                Resource: !GetAtt AuftragsQueueSchluessel.Arn

  # ── IAM: MINIMALE RECHTE FÜR DEN VERBRAUCHER (Lambda) ──────────────────────────────────────
  VerbraucherRolle:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'helmut-auftrags-verbraucher-${Umgebung}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: nur-empfangen-und-loeschen
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'sqs:ReceiveMessage'
                  - 'sqs:DeleteMessage'
                  - 'sqs:GetQueueAttributes'
                  # KEIN sqs:SendMessage: der Verbraucher erzeugt NIE selbst Nachrichten.
                  # Folgeaufträge entstehen über die Outbox in Supabase, nie in der Queue.
                Resource: !GetAtt AuftragsQueue.Arn
              - Effect: Allow
                Action:
                  - 'kms:Decrypt'
                # ZWEI Schlüssel, zwei Gründe:
                #   * der eigene Queue-Schlüssel — sonst ist die empfangene Nachricht
                #     Chiffretext,
                #   * der Parameter-Schlüssel — sonst schlägt GetParameter mit
                #     WithDecryption=true fehl und der Verbraucher bekommt NIE eine
                #     Supabase-Verbindung (er stoppt dann geschlossen, aber er arbeitet nie).
                # KORREKTUR 2026-08-14/4: hier stand die ARN des Alias `alias/aws/ssm`. Eine
                # Alias-ARN im Resource-Feld gewährt NICHTS — "You cannot use a key id, alias
                # name, or alias ARN to identify a KMS key in an IAM policy statement" und
                # "When an alias is the value of a resource element, the policy applies to the
                # alias resource, not to any KMS key" (AWS KMS Developer Guide; Quellen und
                # Einordnung: Belegdatei §25). Es MUSS die SCHLÜSSEL-ARN sein.
                Resource:
                  - !GetAtt AuftragsQueueSchluessel.Arn
                  - !GetAtt ParameterSchluessel.Arn
              - Effect: Allow
                Action:
                  - 'ssm:GetParameter'
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SupabaseUrlParameter}'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SupabaseSchluesselParameter}'
              - Effect: Allow
                Action:
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/helmut-auftrags-verbraucher-${Umgebung}:*'

  VerbraucherLogGruppe:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/helmut-auftrags-verbraucher-${Umgebung}'
      # Wecksignal-Protokolle enthalten nur Auftrags-IDs, Ausgänge und Dauern — keine
      # politischen Inhalte. 30 Tage genügen für die Fehlersuche.
      RetentionInDays: 30

  VerbraucherFunktion:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'helmut-auftrags-verbraucher-${Umgebung}'
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: lambda/index.handler
      Role: !GetAtt VerbraucherRolle.Arn
      # TIMEOUT < SICHTBARKEITSZEIT (180 s < 360 s): eine Verarbeitung endet immer, bevor
      # dieselbe Nachricht erneut sichtbar werden kann.
      Timeout: 180
      MemorySize: 512
      # HARTE PARALLELITÄTSGRENZE: mehr gleichzeitige Verbraucher startet AWS nicht.
      ReservedConcurrentExecutions: !Ref MaxParallelitaet
      Environment:
        Variables:
          # KEINE SECRETS IM KLARTEXT. Die Funktion liest sie zur Laufzeit aus SSM.
          HELMUT_SUPABASE_URL_PARAMETER: !Ref SupabaseUrlParameter
          HELMUT_SUPABASE_KEY_PARAMETER: !Ref SupabaseSchluesselParameter
          HELMUT_SCALABLE_PIPELINE: 'on'
          HELMUT_JOB_DISPATCH_MODE: 'queue'
          HELMUT_JOB_TRANSPORT: 'sqs'
          HELMUT_KLASSEN_GRENZEN: 'on'
          # ── DER UNMITTELBARE RELAY-ANSTOSS (Verkabelungslauf 2026-08-14/4) ──────────────
          # OHNE DIESE ZEILE WAR DIE KETTE UNTERBROCHEN: `lambda-verbraucher.js` liest genau
          # diesen Namen, um die Relay-Funktion asynchron aufzurufen. Fehlte er, fand der
          # Verbraucher keinen Ausloeser — und der Anstoss verschwand still.
          # `!Ref` auf eine AWS::Lambda::Function liefert den FUNKTIONSNAMEN, und genau den
          # erwartet `InvokeCommand.FunctionName`.
          HELMUT_RELAY_FUNKTION: !Ref RelayFunktion
          # BEWUSST NICHT GESETZT: HELMUT_SQS_QUEUE_URL. Der Verbraucher soll NIE selbst
          # senden — er hat dafuer auch kein `sqs:SendMessage`. Beides zusammen macht einen
          # stillen Rueckfall auf Direktversand strukturell unmoeglich.
      Code:
        # PAKETQUELLE (Korrekturlauf 2026-08-14/3, Lücke 2): kein Platzhalter mehr. Das
        # Archiv wird reproduzierbar aus dem Repository gebaut
        # (`node scripts/lambda-paket-bauen.js`) und vor dem Ausrollen nach S3 geladen.
        # Der Bauweg liefert Manifest und SHA-256 als Integritätsnachweis.
        S3Bucket: !Ref PaketBucket
        S3Key: !Ref PaketSchluessel

  # ── ANBINDUNG QUEUE -> LAMBDA ──────────────────────────────────────────────────────────────
  VerbraucherAnbindung:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt AuftragsQueue.Arn
      FunctionName: !GetAtt VerbraucherFunktion.Arn
      BatchSize: 5
      MaximumBatchingWindowInSeconds: 5
      # PARTIELLE FEHLERANTWORT: ohne diese Einstellung würde ein einziger Fehler den
      # gesamten Stapel erneut zustellen — auch die bereits erledigten Nachrichten.
      FunctionResponseTypes:
        - ReportBatchItemFailures
      ScalingConfig:
        # Zusätzlich zur reservierten Parallelität: SQS selbst startet nie mehr gleichzeitige
        # Verbraucher als hier erlaubt.
        MaximumConcurrency: !Ref MaxParallelitaet

  # ── RELAY: der dauerhafte Antrieb der Outbox (Korrekturlauf 2026-08-14/3, Lücke 1) ────────
  # Er transportiert ausschließlich SIGNALE: fällige Versandabsichten aus der Outbox lesen,
  # an SQS senden, Ergebnis verbuchen. Keine Facharbeit, kein Modellaufruf, kein Quellenabruf.
  RelayRolle:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'helmut-outbox-relay-${Umgebung}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: nur-senden-und-lesen
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  # Der Relay ist der EINZIGE Produzent. Er empfängt nichts und löscht nichts.
                  - 'sqs:SendMessage'
                Resource: !GetAtt AuftragsQueue.Arn
              - Effect: Allow
                Action:
                  # Produzentenrechte, siehe Kommentar beim Sender.
                  - 'kms:GenerateDataKey'
                  - 'kms:Decrypt'
                Resource: !GetAtt AuftragsQueueSchluessel.Arn
              - Effect: Allow
                Action:
                  - 'ssm:GetParameter'
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SupabaseUrlParameter}'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SupabaseSchluesselParameter}'
              - Effect: Allow
                Action:
                  - 'kms:Decrypt'
                # Die beiden SecureString-Parameter sind mit GENAU diesem Schlüssel
                # verschlüsselt (der Betreiber legt sie mit `--key-id` an, Runbook §22.2);
                # ohne Decrypt käme nur Chiffretext an.
                # KORREKTUR 2026-08-14/4: hier stand eine Alias-ARN — sie gewährt nichts.
                Resource: !GetAtt ParameterSchluessel.Arn
              - Effect: Allow
                Action:
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/helmut-outbox-relay-${Umgebung}:*'

  RelayLogGruppe:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/helmut-outbox-relay-${Umgebung}'
      RetentionInDays: 30

  RelayFunktion:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'helmut-outbox-relay-${Umgebung}'
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: lambda/relay.handler
      Role: !GetAtt RelayRolle.Arn
      Timeout: 60
      MemorySize: 512
      # Der Relay ist bewusst SCHMAL gedeckelt: er ist kein Arbeiter, sondern eine Klingel.
      # Zusammen mit der Klassen-Lease `outbox-relay` (max 1) kann keine Aufruflawine
      # entstehen, auch wenn viele Verbraucher gleichzeitig anstoßen.
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          HELMUT_SUPABASE_URL_PARAMETER: !Ref SupabaseUrlParameter
          HELMUT_SUPABASE_KEY_PARAMETER: !Ref SupabaseSchluesselParameter
          HELMUT_SCALABLE_PIPELINE: 'on'
          HELMUT_JOB_DISPATCH_MODE: 'queue'
          HELMUT_JOB_TRANSPORT: 'sqs'
          HELMUT_KLASSEN_GRENZEN: 'on'
          HELMUT_SQS_QUEUE_URL: !Ref AuftragsQueue
          HELMUT_RELAY_MAX_LAEUFE: '5'
      Code:
        S3Bucket: !Ref PaketBucket
        S3Key: !Ref PaketSchluessel

  # ── ZEITGEBER: trägt SPÄTER fällige Arbeit und repariert einen verlorenen Anstoß ───────────
  # Minütlich = 1.440 Aufrufe/Tag. Kostenklasse: Lambda-Aufrufe + GB-Sekunden (ein Leerlauf
  # dauert Millisekunden) sowie EventBridge-Scheduler-Aufrufe. Bewusst NICHT aktiviert.
  RelayZeitgeberRolle:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'helmut-relay-zeitgeber-${Umgebung}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: nur-relay-aufrufen
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'lambda:InvokeFunction'
                Resource: !GetAtt RelayFunktion.Arn

  RelayZeitgeber:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub 'helmut-outbox-relay-${Umgebung}'
      Description: >-
        Minütlicher Relay-Lauf: stellt später fällige Versandabsichten zu und repariert
        einen verlorenen unmittelbaren Anstoß. Ohne ihn wäre der Vercel-Cron wieder für
        den normalen Fortgang erforderlich.
      ScheduleExpression: 'rate(1 minute)'
      ScheduleExpressionTimezone: 'Europe/Berlin'
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: DISABLED          # NICHT aktiviert — Einschalten ist eine Betreiberentscheidung
      Target:
        Arn: !GetAtt RelayFunktion.Arn
        RoleArn: !GetAtt RelayZeitgeberRolle.Arn
        Input: '{"ausloeser":"zeitgeber"}'
        RetryPolicy:
          # Ein verpasster Lauf ist folgenlos — der nächste kommt in einer Minute.
          MaximumRetryAttempts: 0

  # Der Verbraucher darf GENAU EINE Sache zusätzlich: den Relay asynchron anstoßen.
  VerbraucherRelayRecht:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub 'helmut-verbraucher-relay-anstoss-${Umgebung}'
      Roles: [!Ref VerbraucherRolle]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: 'lambda:InvokeFunction'
            Resource: !GetAtt RelayFunktion.Arn

Outputs:
  QueueUrl:
    Description: Wert für HELMUT_SQS_QUEUE_URL (Sender-Seite, Vercel).
    Value: !Ref AuftragsQueue
  QuarantaeneUrl:
    Description: Dead-Letter-Queue — hier landen dauerhaft unbrauchbare Nachrichten.
    Value: !Ref AuftragsQuarantaene
  Region:
    Description: Datenresidenz des Transports.
    Value: !Ref 'AWS::Region'
