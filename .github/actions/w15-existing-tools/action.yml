name: Existing pinned W15 tools
description: Reuse the reviewed Node, PostgREST and PostgreSQL image
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24.19.0
    - shell: bash
      run: |
        set -euo pipefail
        mkdir "$RUNNER_TEMP/w15-mock-image"
        cp "$(command -v node)" "$RUNNER_TEMP/w15-mock-image/node"
        curl -fsSL --max-time 90 -o "$RUNNER_TEMP/w15-mock-postgrest.tar.xz" https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz
        echo "9f71269e61ac3a940281e93ff415760f5957e430e475ba4c3889f3ede7d5527c  $RUNNER_TEMP/w15-mock-postgrest.tar.xz" | sha256sum -c -
        tar -xJf "$RUNNER_TEMP/w15-mock-postgrest.tar.xz" -C "$RUNNER_TEMP/w15-mock-image"
        echo "bc17c508ffeed0ec622934f9b7fa72f8e78da65350e63c3eceb56fa688aa5e12  $RUNNER_TEMP/w15-mock-image/node" | sha256sum -c -
        echo "870a77f49508479bc87c5504b6b0c3715c7220926932d916b0d73952b297c617  $RUNNER_TEMP/w15-mock-image/postgrest" | sha256sum -c -
        cp scripts/auth-usage-split.Dockerfile "$RUNNER_TEMP/w15-mock-image/Dockerfile"
        docker build -t helmut-w15-existing:20261029 "$RUNNER_TEMP/w15-mock-image"
        echo "W15_IMAGE_ID=$(docker image inspect --format '{{.Id}}' helmut-w15-existing:20261029)" >> "$GITHUB_ENV"
        echo "W15_NODE_SOURCE=$RUNNER_TEMP/w15-mock-image/node" >> "$GITHUB_ENV"
        echo "W15_POSTGREST_SOURCE=$RUNNER_TEMP/w15-mock-image/postgrest" >> "$GITHUB_ENV"
