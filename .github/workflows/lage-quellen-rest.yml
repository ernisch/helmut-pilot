name: Lage Quellen REST isoliert

# Nur dieser freigegebene Testbranch. Kein PR Gate, Zeitplan oder Productionpfad.
on:
  push:
    branches: [codex/500-lage-quellenfenster-20260913]
    paths:
      - .github/workflows/lage-quellen-rest.yml
      - scripts/lage-quellen-rest-datenbank-test.js
      - lib/helmut/storage.js

permissions:
  contents: read

concurrency:
  group: lage-quellen-rest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rest:
    name: Zwei Quellenleser gegen PostgreSQL und PostgREST
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: helmut
          POSTGRES_PASSWORD: helmut
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U helmut"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Bestehende Abhaengigkeiten
        run: npm ci
      - name: Bestehende CI Werkzeuge bereitstellen
        timeout-minutes: 3
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 60 \
            -o /tmp/postgrest.tar.xz \
            https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz
          echo "9f71269e61ac3a940281e93ff415760f5957e430e475ba4c3889f3ede7d5527c  /tmp/postgrest.tar.xz" | sha256sum -c -
          tar -xJf /tmp/postgrest.tar.xz -C /tmp
          /tmp/postgrest --version
      - name: Exakten Kandidaten und isolierte Leser pruefen
        timeout-minutes: 3
        env:
          HELMUT_TEST_PG_HOST: "127.0.0.1"
          HELMUT_TEST_PG_PORT: "5433"
          HELMUT_TEST_PG_USER: "helmut"
          HELMUT_TEST_POSTGREST_BIN: "/tmp/postgrest"
          PGPASSWORD: "helmut"
        run: |
          set -euo pipefail
          git rev-parse HEAD HEAD^{tree}
          node scripts/lokal.js -- node scripts/lage-quellen-rest-datenbank-test.js
