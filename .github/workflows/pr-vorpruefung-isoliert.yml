name: Kanonische Offline Vorpruefung isoliert

# Profilkontextkandidat: Ausfuehrung erst nach ausdruecklicher Push Freigabe.
# Bestehender geschuetzter Testbranch. Kein PR Trigger und kein Productionpfad.
on:
  push:
    branches: [codex/500-lage-quellenfenster-20260913]
    paths:
      - .github/workflows/pr-vorpruefung-isoliert.yml

permissions:
  contents: read

concurrency:
  group: pr-vorpruefung-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline:
    name: Kanonischer Gesamtlauf vor PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Vorhandene Abhaengigkeiten aus Lockdatei bereitstellen
        timeout-minutes: 3
        run: npm ci --ignore-scripts
      - name: Alle Offline Suiten nacheinander nur mit Loopback
        timeout-minutes: 15
        run: |
          set -euo pipefail
          git log -1 --format='%H %T'
          test ! -e .helmut-data
          test ! -e .env
          test ! -e .env.local
          mkdir -p "$RUNNER_TEMP/helmut-pr-home"
          sudo env -i PATH="$PATH" HOME="$RUNNER_TEMP/helmut-pr-home" \
            TEST_UID="$(id -u)" TEST_GID="$(id -g)" \
            unshare --net bash <<'SH'
          set -euo pipefail
          ip link set lo up
          test "$(ip -o link show | wc -l)" -eq 1
          test -z "$(ip route show)"
          printf 'ISOLATION: nur Loopback, keine Route, keine Anbieterumgebung\n'
          # Der Test laeuft als urspruenglicher Runnernutzer, nicht als root.
          exec setpriv --reuid="$TEST_UID" --regid="$TEST_GID" --init-groups \
            node scripts/lokal.js -- node scripts/run-offline-tests.js
          SH
      - name: Eigenen kurzlebigen Testbestand entfernen
        if: always()
        run: |
          set -euo pipefail
          sudo rm -rf -- .helmut-data "$RUNNER_TEMP/helmut-pr-home"
          test ! -e .helmut-data
          test ! -e "$RUNNER_TEMP/helmut-pr-home"
          git diff --exit-code
          printf 'BEREINIGUNG: eigener Testbestand und temporaeres Home entfernt\n'
