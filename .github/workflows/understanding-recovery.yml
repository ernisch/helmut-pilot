name: "Understanding-Recovery (1 freigegebener Fall — vg-sozialwohnungen)"

on:
  workflow_dispatch:
    inputs:
      confirm_text:
        description: "Fuer den ECHTEN Lauf EXAKT eingeben: RECOVER_SOZIALWOHNUNGEN_CONFIRMED (sonst nur Plan+Snapshot, read-only)"
        required: true
        default: ""

# ECHTE Recovery des EINEN freigegebenen Vorgangs vg-sozialwohnungen (2026-07-17).
# NUR manuell (workflow_dispatch), harte Bestaetigung. Eng begrenzt auf die
# Allowlist in lib/helmut/understanding-recovery.js (GENAU 1 vorgang_id).
# Schritt A (IMMER, read-only): Plan + Pre-Snapshot. Kein Write, kein KI.
# Schritt B (NUR bei confirm_text == "RECOVER_SOZIALWOHNUNGEN_CONFIRMED"): understanding.understandOneCluster
#   fuer den EINEN Fall — genau 1 KI-Call, genau 1 neues complete-KO (+ Links),
#   Rollback-Kennung "recovery:rec-<run_id>" im Feld understanding_model, idempotent.

permissions:
  contents: read

concurrency:
  group: understanding-recovery
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Abhaengigkeiten (keine Runtime-Deps; defensiv, kein Lockfile)
        run: npm install --no-audit --no-fund

      - name: Preflight Store-Secrets vorhanden
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY fehlen."; exit 1
          fi
          echo "Preflight Store OK."

      - name: Schritt A Plan und Pre-Snapshot (read-only)
        env:
          HELMUT_V3_STORE: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/understanding-recovery-execute.js

      - name: Preflight KI-Key (nur fuer echten Lauf)
        if: ${{ inputs.confirm_text == 'RECOVER_SOZIALWOHNUNGEN_CONFIRMED' }}
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if { [ -z "${AZURE_OPENAI_ENDPOINT:-}" ] || [ -z "${AZURE_OPENAI_KEY:-}" ]; } && [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::Kein KI-Key vorhanden — Abbruch, um keine regelbasierten Ersatz-KOs zu schreiben."; exit 1
          fi
          echo "Preflight KI OK."

      - name: Schritt B Echter Recovery-Lauf (max 6 KI + Writes)
        if: ${{ inputs.confirm_text == 'RECOVER_SOZIALWOHNUNGEN_CONFIRMED' }}
        env:
          HELMUT_V3_STORE: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HELMUT_MAX_LLM_CALLS_PER_DAY: "150"
          HELMUT_RECOVERY_EXECUTE: "1"
          HELMUT_RECOVERY_CONFIRM: "RECOVER_SOZIALWOHNUNGEN_CONFIRMED"
          HELMUT_RECOVERY_RUNID: "rec-${{ github.run_id }}"
        run: |
          set -euo pipefail
          echo "Starte ECHTEN Recovery-Lauf (Runkennung rec-${{ github.run_id }})."
          node scripts/understanding-recovery-execute.js

      - name: Hinweis kein echter Lauf
        if: ${{ inputs.confirm_text != 'RECOVER_SOZIALWOHNUNGEN_CONFIRMED' }}
        run: |
          echo "Kein echter Lauf (nur Plan/Snapshot, read-only) - confirm_text war nicht exakt RECOVER_SOZIALWOHNUNGEN_CONFIRMED."
