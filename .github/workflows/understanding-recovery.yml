name: "Understanding-Recovery Einzel-Dokument (vg-sozialwohnungen)"

on:
  workflow_dispatch:
    inputs:
      confirm_text:
        description: "Fuer den ECHTEN Lauf EXAKT eingeben RECOVER_SOZIALWOHNUNGEN_SINGLEDOC (sonst nur read-only Vorschau)"
        required: true
        default: ""

# ECHTE Einzel-Dokument-Recovery des EINEN freigegebenen Vorgangs vg-sozialwohnungen.
# Rekonstruiert GENAU 1 Wissensobjekt aus GENAU 1 per exakter raw_document_id fest
# verdrahtetem Seed-Dokument (lib/helmut/single-doc-recovery.js). KEINE Anker-/
# Teilstring-/Themen-/Pool-Suche. Nur manuell (workflow_dispatch), harte Bestaetigung.
# Schritt A (IMMER, read-only): Plan-Vorschau. Kein Write, kein KI.
# Schritt B (NUR bei confirm_text == "RECOVER_SOZIALWOHNUNGEN_SINGLEDOC"): max 1 KI-Call,
#   max 1 neues complete-KO (+ 1 Link), Rollback-Kennung "recovery:singledoc-<run_id>".

permissions:
  contents: read

concurrency:
  group: understanding-recovery
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Abhaengigkeiten (keine Runtime-Deps; defensiv, kein Lockfile)
        run: npm install --no-audit --no-fund

      - name: Preflight Store-Secrets vorhanden
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY fehlen."; exit 1
          fi
          echo "Preflight Store OK."

      - name: Schritt A read-only Vorschau (kein Flag/Token)
        env:
          HELMUT_V3_STORE: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/understanding-single-doc-recovery.js

      - name: Preflight KI-Key (nur fuer echten Lauf)
        if: ${{ inputs.confirm_text == 'RECOVER_SOZIALWOHNUNGEN_SINGLEDOC' }}
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if { [ -z "${AZURE_OPENAI_ENDPOINT:-}" ] || [ -z "${AZURE_OPENAI_KEY:-}" ]; } && [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::Kein KI-Key vorhanden — Abbruch, um keine regelbasierten Ersatz-KOs zu schreiben."; exit 1
          fi
          echo "Preflight KI OK."

      - name: Schritt B Echter Einzel-Dokument-Lauf (max 1 KI + 1 Write)
        if: ${{ inputs.confirm_text == 'RECOVER_SOZIALWOHNUNGEN_SINGLEDOC' }}
        env:
          HELMUT_V3_STORE: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HELMUT_MAX_LLM_CALLS_PER_DAY: "150"
          HELMUT_SINGLEDOC_RECOVERY_EXECUTE: "1"
          HELMUT_SINGLEDOC_RECOVERY_CONFIRM: "RECOVER_SOZIALWOHNUNGEN_SINGLEDOC"
          HELMUT_SINGLEDOC_RECOVERY_RUNID: "singledoc-${{ github.run_id }}"
        run: |
          set -euo pipefail
          echo "Starte ECHTEN Einzel-Dokument-Recovery-Lauf (Kennung singledoc-${{ github.run_id }})."
          node scripts/understanding-single-doc-recovery.js

      - name: Hinweis kein echter Lauf
        if: ${{ inputs.confirm_text != 'RECOVER_SOZIALWOHNUNGEN_SINGLEDOC' }}
        run: |
          echo "Kein echter Lauf (nur read-only Vorschau) - confirm_text war nicht exakt RECOVER_SOZIALWOHNUNGEN_SINGLEDOC."
