name: Briefing Watchdog

# Unabhängiger Backstop + Health-Check für Helmut.
# - Triggert täglich den V3-Pipeline-Lauf (falls Vercels eigener Cron ausfällt).
# - Prüft die ECHTE Pipeline-Antwort und schlägt fehl (-> GitHub schickt dir eine
#   E-Mail), wenn der Lauf nicht 200 liefert ODER die Pipeline fachlich fehlschlägt
#   (Pipeline-/Understanding-Fehler oder keine erfolgreiche Quelle).
#
# WICHTIG: Der Endpoint /api/cron/pipeline führt den V3-Crawl aus und liefert BEWUSST
# KEIN Briefing (kein V2-Briefing-Lauf mehr) — seine Antwort trägt successfulSources /
# understanding{} / errors[], NICHT briefing.generatedAt. Deshalb wird der Erfolg an
# genau diesen Feldern gemessen (scripts/watchdog-eval.js). Briefing-Frische ist ein
# SEPARATER Check gegen einen Briefing-Endpoint und bewusst NICHT Teil dieses Watchdogs.

on:
  schedule:
    # 05:30 UTC = 07:30 Berlin (Sommer) — kurz NACH Vercels morning-briefing (05:00 UTC).
    - cron: "30 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: briefing-watchdog
  cancel-in-progress: false

jobs:
  refresh-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken (Watchdog-Auswertung)
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pipeline triggern und Erfolg prüfen
        env:
          BASE_URL: ${{ vars.HELMUT_PROD_URL || 'https://helmut-pilot.vercel.app' }}
          CRON_SECRET: ${{ secrets.HELMUT_CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::HELMUT_CRON_SECRET ist nicht gesetzt."
            exit 1
          fi

          echo "Rufe Pipeline auf: ${BASE_URL}/api/cron/pipeline"
          HTTP_CODE=$(curl -sS --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -o response.json -w "%{http_code}" \
            "${BASE_URL}/api/cron/pipeline" || echo "000")

          echo "HTTP-Status: ${HTTP_CODE}"
          echo "--- Antwort (gekürzt) ---"
          head -c 1200 response.json || true
          echo ""

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Pipeline-Aufruf fehlgeschlagen (HTTP ${HTTP_CODE}). Pipeline wurde NICHT ausgeführt."
            exit 1
          fi

          # Erfolg an der ECHTEN Pipeline-Antwort messen (successfulSources + 0 Understanding-
          # Fehler), NICHT an briefing.generatedAt (das dieser Endpoint per Design nicht trägt).
          node scripts/watchdog-eval.js response.json
