name: Briefing Watchdog

# Unabhängiger Backstop + Health-Check für Helmut.
# - Erzwingt täglich ein frisches Briefing (falls Vercels eigener Cron ausfällt).
# - Prüft die Antwort und schlägt fehl (-> GitHub schickt dir eine E-Mail),
#   wenn der Lauf nicht 200 liefert oder das Briefing nicht frisch (< 6h) ist.

on:
  schedule:
    # 05:30 UTC = 07:30 Berlin (Sommer) — kurz NACH Vercels morning-briefing (05:00 UTC).
    - cron: "30 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: briefing-watchdog
  cancel-in-progress: false

jobs:
  refresh-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Pipeline triggern und Frische prüfen
        env:
          BASE_URL: ${{ vars.HELMUT_PROD_URL || 'https://helmut-pilot.vercel.app' }}
          CRON_SECRET: ${{ secrets.HELMUT_CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::HELMUT_CRON_SECRET ist nicht gesetzt."
            exit 1
          fi

          echo "Rufe Pipeline auf: ${BASE_URL}/api/cron/pipeline"
          HTTP_CODE=$(curl -sS --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -o response.json -w "%{http_code}" \
            "${BASE_URL}/api/cron/pipeline" || echo "000")

          echo "HTTP-Status: ${HTTP_CODE}"
          echo "--- Antwort (gekürzt) ---"
          head -c 1200 response.json || true
          echo ""

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Pipeline-Aufruf fehlgeschlagen (HTTP ${HTTP_CODE}). Briefing wurde NICHT erneuert."
            exit 1
          fi

          GENERATED_AT=$(node -e '
            const fs = require("fs");
            let data;
            try { data = JSON.parse(fs.readFileSync("response.json", "utf8")); }
            catch (e) { console.error("Antwort ist kein gültiges JSON"); process.exit(2); }
            const b = data.briefing || (data.result && data.result.briefing) || {};
            const ts = b.generatedAt || b.date || "";
            if (!ts) { console.error("Kein generatedAt in der Antwort gefunden"); process.exit(3); }
            process.stdout.write(ts);
          ')

          echo "Briefing generatedAt: ${GENERATED_AT}"

          AGE_OK=$(node -e '
            const ts = process.argv[1];
            const ageMs = Date.now() - new Date(ts).getTime();
            const sixHours = 6 * 60 * 60 * 1000;
            if (Number.isNaN(ageMs)) { console.error("generatedAt nicht parsebar:", ts); process.exit(4); }
            console.log(Math.round(ageMs / 60000) + " min alt");
            process.exit(ageMs <= sixHours ? 0 : 5);
          ' "${GENERATED_AT}") || {
            echo "::error::Briefing ist nicht frisch (${AGE_OK}). Erwartet < 6h."
            exit 1
          }

          echo "::notice::OK — frisches Briefing (${AGE_OK})."
