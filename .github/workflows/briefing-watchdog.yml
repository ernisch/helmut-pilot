name: Briefing Watchdog

# Unabhängiger Backstop + Health-Check für Helmut.
# - Triggert täglich den V3-Pipeline-Lauf (falls Vercels eigener Cron ausfällt).
# - Prüft die ECHTE Pipeline-Antwort und schlägt fehl (-> GitHub schickt dir eine
#   E-Mail), wenn der Lauf nicht 200 liefert ODER die Pipeline fachlich fehlschlägt
#   (Pipeline-/Understanding-Fehler oder keine erfolgreiche Quelle).
#
# WICHTIG: Der Endpoint /api/cron/pipeline führt den V3-Crawl aus und liefert BEWUSST
# KEIN Briefing (kein V2-Briefing-Lauf mehr) — seine Antwort trägt successfulSources /
# understanding{} / errors[], NICHT briefing.generatedAt. Deshalb wird der Erfolg an
# genau diesen Feldern gemessen (scripts/watchdog-eval.js).
#
# TIMEOUT-FIX (2026-07-15): Früher brach `curl --max-time 120` nach 120 s ab und
# der Workflow behauptete "Pipeline wurde NICHT ausgeführt" — obwohl die Pipeline
# serverseitig nach ~193 s erfolgreich mit HTTP 200 abschloss (Vercel erlaubt
# maxDuration=300 s; der Endpoint begrenzt sich intern auf 280 s). Die gesamte
# Aufruf- und Auswertungslogik liegt jetzt in scripts/watchdog-pipeline-check.js
# (lokal testbar: scripts/watchdog-pipeline-check-test.js):
#   - Client-Timeout 330 s (> Server-Maximum: der Server antwortet immer vorher).
#   - Nach einem Client-Timeout wird der Abschluss über den rein lesenden
#     Statuspfad /api/cron/pipeline-status verifiziert (KEIN zweiter Trigger).
#   - Vier ehrliche Endzustände: Erfolg / Erfolg-nach-Timeout / Fehler /
#     Unbekannt-oder-läuft-noch. Nie wieder "nicht ausgeführt" ohne Beleg.

on:
  schedule:
    # 05:30 UTC = 07:30 Berlin (Sommer) — kurz NACH Vercels morning-briefing (05:00 UTC).
    - cron: "30 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: briefing-watchdog
  cancel-in-progress: false

jobs:
  refresh-and-check:
    runs-on: ubuntu-latest
    # Obergrenze: 330 s Pipeline-Call + 6×30 s Status-Polls + Puffer.
    timeout-minutes: 15
    steps:
      - name: Repo auschecken (Watchdog-Auswertung)
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pipeline triggern und Erfolg prüfen (testbare Logik, kein Inline-Bash)
        env:
          BASE_URL: ${{ vars.HELMUT_PROD_URL || 'https://helmut-pilot.vercel.app' }}
          CRON_SECRET: ${{ secrets.HELMUT_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::HELMUT_CRON_SECRET ist nicht gesetzt."
            exit 1
          fi
          node scripts/watchdog-pipeline-check.js
