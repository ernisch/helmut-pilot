name: Private CI log metadata only (not CI validation)

# A new push workflow can run on this exact isolated branch without a main merge.
# Do not open a PR for this temporary diagnostic branch: normal CI is unchanged.
on:
  push:
    branches: [codex/ci-private-diagnostic-40065052810]
    paths:
      - .github/workflows/ci-private-log-metadata.yml
      - scripts/helmut-resource-meter/ci-private-log-metadata.py

permissions:
  contents: read

concurrency:
  group: ci-private-metadata-40065052810
  cancel-in-progress: false

jobs:
  exact-encrypted-log-metadata:
    name: Diagnostic metadata only — no tests or CI acceptance
    if: >-
      github.repository == 'ernisch/helmut-pilot' &&
      github.repository_id == '1274160979' &&
      github.actor_id == '273344519' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/ci-private-diagnostic-40065052810' &&
      github.sha == github.event.after &&
      github.event.head_commit.message == 'helmut-ci-metadata-only:40065052810:12549186901:336ad5a2d94ef926148f9487a5abdf400d255403'
    environment: helmut-ci-originals
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Read exact retained encrypted log; emit public whitelist only
        env:
          GH_TOKEN: ${{ github.token }}
          HELMUT_CI_ORIGINALS_KEY: ${{ secrets.HELMUT_CI_ORIGINALS_KEY }}
        run: python3 -I -S -B scripts/helmut-resource-meter/ci-private-log-metadata.py --read-exact-ci-log-metadata
