name: Lokaler DeepSeek-Budgetwaechter
on:
  pull_request:
    paths:
      - 'tools/deepseek-budget/**'
      - '.github/workflows/deepseek-budget.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Atomare Kosten- und Wiederholungsgrenzen ohne Netzwerk oder Modellkosten
        run: python3 -B tools/deepseek-budget/test_budget.py
