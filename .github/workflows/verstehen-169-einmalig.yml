# Helmut — EINMALIGER scharfer Verstehenslauf fuer genau 169 gebundene Rohdokumente.
# =============================================================================================
# Dieser Workflow ist NUR der sichere manuelle Ausfuehrungsweg des bereits fertig geprueften
# Runners. Er enthaelt KEINE zweite Fachlogik: Bindung (169/122), Kandidaten (113), Quittung,
# globale Sperre, CAS/Fencing, Budget, 0,80-USD-Laufdeckel, 35-min-Zeitdeckel und
# Lesefehler-fail-closed bleiben vollstaendig im Runner (`scripts/verstehen-einmalig-169.js`
# + `lib/helmut/verstehen-einmalig.js`). Kanonischer Beleg:
# docs/betrieb/verstehen-einmalig-169-20260922.md.
#
# SCHARF HEISST SCHARF: Der Lauf startet NUR manuell auf main mit dem EXAKTEN
# Bestaetigungswort, genau einmal (run_attempt 1), innerhalb der bestehenden globalen
# Concurrency-Gruppe der kontrollierten Production-KI-Arbeit. Kein Schedule, kein Push,
# kein PR, keine automatische Wiederholung.
#
# ZWEI GETRENNTE COMMITS (nie vermischen):
#   * HELMUT_VERSTEHEN_169_COMMIT ist der DOKUMENT-SNAPSHOT-Commit (der Datensatz, aus dem die
#     169 Kennungen / der Hash / die 122 Cluster stammen) — fest eingeschrieben, unveraendert.
#   * inputs.runtime_commit ist der Git-Commit des TATSAECHLICH auszufuehrenden Codes.
#
# RUNTIME-COMMIT IST AN DEN DISPATCH GEBUNDEN (fail closed, drei Seiten muessen gleich sein):
#   angefordertes `runtime_commit` == `github.sha` des auf `main` gestarteten Dispatches
#                              == tatsaechlich ausgecheckter Commit (`git rev-parse HEAD`).
# Der Job laeuft bei Abweichung gar nicht erst an (Job-`if`), und der Preflight bricht zusaetzlich
# hart ab — BEVOR die Production-Zugangsdaten benutzt werden und bevor der Runner startet.
# Damit kann KEIN beliebiger, aelterer oder fremder Repository-Commit mit den Production-
# Zugangsdaten (Supabase/Azure) ausgefuehrt werden — nur der main-Commit dieses Dispatches.
#
# NICHT ueber scripts/lokal.js starten: der lokale Starter entfernt Production-Zugangsdaten
# und schaltet den Speicher auf lokal — der scharfe Lauf braucht die echten Zugangsdaten.

name: Verstehen 169 · Einmaliger scharfer Lauf

on:
  workflow_dispatch:
    inputs:
      confirm_text:
        description: >-
          Exaktes Bestaetigungswort des 169er Auftrags
          (EINMALIGER_VERSTEHENSLAUF_169_RUHDOKUMENTE_BESTAETIGT)
        required: true
      quittungsschluessel:
        description: >-
          NUR fuer einen NEUEN 169er Versuch: eigene, vom Betreiber vergebene
          Quittungskennung (Format verstehen169-JJJJMMTT-suffix, niemals die alte
          verstehen169-20260922-a). Leer = alter Auftrag (bleibt blockiert).
        required: false
        default: ""
      runtime_commit:
        description: >-
          Der Git-Commit des TATSAECHLICH auszufuehrenden Codes (voller 40-stelliger SHA).
          ER MUSS exakt der main-Commit sein, auf dem dieser Dispatch gestartet wird
          (github.sha) — jeder andere, auch ein aelterer oder fremder gueltiger Commit, wird vor
          dem Runner-Aufruf abgelehnt. WICHTIG: das ist NICHT der Dokument-Snapshot-Commit
          ea84f26c... Der Workflow checkt genau diesen Commit aus und prueft ihn zusaetzlich
          gegen den echten Checkout (git rev-parse HEAD).
        required: true

permissions:
  contents: read

jobs:
  laeufer:
    # Klarer Name: ein uebersprungener Job (falscher runtime_commit) ist damit im Run sichtbar
    # als "Scharfer Lauf — nur der main-Commit dieses Dispatches" statt als raetselhaftes Skip.
    name: Scharfer Lauf — nur der main-Commit dieses Dispatches
    if: >-
      github.repository == 'ernisch/helmut-pilot' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1 &&
      inputs.confirm_text == 'EINMALIGER_VERSTEHENSLAUF_169_RUHDOKUMENTE_BESTAETIGT' &&
      inputs.runtime_commit == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: helmut-500-kontrollierte-facharbeit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # GENAU der freigegebene Runtime-Commit. Nicht der Workflow-Stand ist der Lauf —
          # der freigegebene Runtime-Commit ist der Lauf.
          ref: ${{ inputs.runtime_commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Abhaengigkeiten (keine Runtime-Deps; defensiv, kein Lockfile)
        run: npm install --no-audit --no-fund
      - name: Preflight — fail closed vor dem Start (keine Secret-Werte)
        env:
          CONFIRM_TEXT: ${{ inputs.confirm_text }}
          QUITTUNGSSCHLUESSEL: ${{ inputs.quittungsschluessel }}
          RUNTIME_COMMIT: ${{ inputs.runtime_commit }}
          # Der SHA des auf main gestarteten Dispatches — die zweite Seite der Bindung.
          DISPATCH_SHA: ${{ github.sha }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT || secrets.AZURE_OPENAI_DEPLOYMENT }}
        run: |
          set -euo pipefail
          fail() { echo "PREFLIGHT-STOP: $1"; exit 1; }
          [ "${CONFIRM_TEXT}" = "EINMALIGER_VERSTEHENSLAUF_169_RUHDOKUMENTE_BESTAETIGT" ] \
            || fail "confirm_text weicht vom Bestaetigungswort ab"
          [ "${GITHUB_REPOSITORY}" = "ernisch/helmut-pilot" ] || fail "falsches Repository"
          [ "${GITHUB_REF}" = "refs/heads/main" ] || fail "nicht auf main"
          [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || fail "falsches Event"
          [ "${GITHUB_RUN_ATTEMPT}" = "1" ] || fail "run_attempt ungleich 1"
          [ -n "${RUNTIME_COMMIT:-}" ] || fail "runtime_commit fehlt"
          echo "${RUNTIME_COMMIT}" | grep -Eq '^[0-9a-f]{40}$' \
            || fail "runtime_commit ist kein voller Git-SHA"
          # BINDUNG 1/2: der angeforderte Commit ist der main-Commit dieses Dispatches. Nur so kann
          # KEIN beliebiger aelterer oder fremder Repository-Commit die Production-Zugangsdaten
          # (Supabase/Azure) bekommen.
          [ -n "${DISPATCH_SHA:-}" ] || fail "Dispatch-SHA fehlt"
          [ "${RUNTIME_COMMIT}" = "${DISPATCH_SHA}" ] \
            || fail "runtime_commit entspricht nicht dem main-Commit dieses Dispatches"
          # BINDUNG 2/2: der echte Checkout ist genau dieser Commit.
          ECHTER_COMMIT="$(git rev-parse HEAD)"
          [ "${ECHTER_COMMIT}" = "${RUNTIME_COMMIT}" ] \
            || fail "Checkout weicht vom angeforderten runtime_commit ab"
          if [ -n "${QUITTUNGSSCHLUESSEL:-}" ]; then
            echo "${QUITTUNGSSCHLUESSEL}" | grep -Eq '^verstehen169-[0-9]{8}-[a-z0-9]([a-z0-9-]*[a-z0-9])?$' \
              || fail "quittungsschluessel weicht vom Muster verstehen169-JJJJMMTT-suffix ab"
            [ "${QUITTUNGSSCHLUESSEL}" != "verstehen169-20260922-a" ] \
              || fail "quittungsschluessel ist die alte Kennung — ein neuer Versuch braucht eine eigene"
          fi
          [ -n "${SUPABASE_URL:-}" ] || fail "SUPABASE_URL fehlt"
          [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || fail "SUPABASE_SERVICE_ROLE_KEY fehlt"
          [ -n "${AZURE_OPENAI_KEY:-}" ] || fail "AZURE_OPENAI_KEY fehlt"
          [ -n "${AZURE_OPENAI_ENDPOINT:-}" ] || fail "AZURE_OPENAI_ENDPOINT fehlt"
          [ -n "${AZURE_OPENAI_DEPLOYMENT:-}" ] || fail "AZURE_OPENAI_DEPLOYMENT fehlt"
          echo "PREFLIGHT ok (keine Secret-Werte ausgegeben)"
      - name: Einmaliger scharfer 169er Verstehenslauf (bestehender Runner, direkt)
        env:
          CONFIRM_TEXT: ${{ inputs.confirm_text }}
          # 169er-Runner-Auftrag (fest eingeschrieben, unveraenderte Grenzen):
          # Dokument-Snapshot-Commit (der DATENSATZ: 169 Kennungen, Hash, 122 Cluster).
          HELMUT_VERSTEHEN_169_COMMIT: "ea84f26ccc380e22961335926e2d4e585cee2308"
          # Runtime-Commit (der TATSAECHLICH ausgeführte Code) — kommt AUSSCHLIESSLICH aus dem
          # freigegebenen Input, ist im Preflight an den Dispatch-SHA gebunden und wird im Runner
          # erneut gegen den echten Checkout geprueft.
          HELMUT_VERSTEHEN_169_RUNTIME_COMMIT: ${{ inputs.runtime_commit }}
          HELMUT_VERSTEHEN_169_LISTE: "belege/verstehen-169-ids.json"
          HELMUT_VERSTEHEN_169_SCHARF: "1"
          HELMUT_VERSTEHEN_169_BESTAETIGT: ${{ inputs.confirm_text }}
          # Nur fuer einen NEUEN Versuch: eigene Kennung (leer = alter Auftrag, blockiert).
          HELMUT_VERSTEHEN_169_QUITTUNG: ${{ inputs.quittungsschluessel }}
          # Production-Zugang (ausschliesslich GitHub Secrets — Werte werden nie geloggt):
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT || secrets.AZURE_OPENAI_DEPLOYMENT }}
          # Nicht geheime Laufwerte (nur fuer diesen Workflow-Prozess):
          HELMUT_V3_STORE: "1"
          HELMUT_STORAGE_BACKEND: "supabase"
          HELMUT_SUPABASE_STORE_ID: "main"
          HELMUT_SUPABASE_AUTH_STORE_ID: "main-auth"
          VERCEL_ENV: "production"
          HELMUT_TESTLAUF_KOMMUNIKATION: "gesperrt"
          HELMUT_MAX_LLM_CALLS_PER_DAY: "2416"
          HELMUT_LLM_RESERVE_UNDERSTANDING: "702"
          HELMUT_TESTLAUF_VORRANG_REAL: "200"
          HELMUT_ANBIETER_STEUERUNG: "on"
          HELMUT_ANBIETER_AZURE_MINUTE: "20"
          HELMUT_ANBIETER_AZURE_TAG: "0"
          HELMUT_LLM_BUDGET_FAIL_CLOSED: "1"
          HELMUT_VERSTEHEN_CAS: "on"
          HELMUT_UNDERSTANDING_LOCK: "on"
        run: node scripts/verstehen-einmalig-169.js
