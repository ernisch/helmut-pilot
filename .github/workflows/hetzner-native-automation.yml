# Install at the already registered path .github/workflows/hetzner-native-automation.yml
# Dedicated workflow on protected main; existing hetzner-ci.yml stays unchanged.
name: Hetzner Native Root Control · bounded automation

on:
  workflow_dispatch:
    inputs:
      controlMode:
        description: 'Explicit per-dispatch controller authorization; disabled by default'
        required: true
        type: choice
        options: [disabled, control-v1]
        default: disabled
      operation:
        description: 'Public control operation; unqualified operations fail before network access'
        required: true
        type: choice
        options: [status, recipient, stage, admit, four-tx]
        default: status
      planSHA:
        description: 'Exact admitted controller plan SHA256, lowercase hexadecimal'
        required: true
        type: string
      payloadSHA:
        description: 'Exact public payload SHA256, lowercase hexadecimal'
        required: true
        type: string
      stageCapsule:
        description: 'Stage only: Base64 recipient-encrypted PGP capsule, at most 48 KiB; no raw URLs'
        required: false
        type: string
        default: ''

permissions: {}

concurrency:
  group: helmut-hetzner-native-control-v1
  cancel-in-progress: false

jobs:
  control:
    if: >-
      github.repository == 'ernisch/helmut-pilot' &&
      github.repository_owner == 'ernisch' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.workflow_ref == 'ernisch/helmut-pilot/.github/workflows/hetzner-native-automation.yml@refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: helmut-hetzner-ci
    permissions:
      contents: read
      id-token: write
    env:
      HELMUT_NATIVE_CONTROL_MODE: ${{ inputs.controlMode }}
      HELMUT_NATIVE_OPERATION: ${{ inputs.operation }}
      HELMUT_NATIVE_PLAN_SHA256: ${{ inputs.planSHA }}
      HELMUT_NATIVE_PAYLOAD_SHA256: ${{ inputs.payloadSHA }}
      HELMUT_NATIVE_STAGE_CAPSULE: ${{ inputs.stageCapsule }}
    steps:
      - name: Exact branch, registered workflow and public input pins
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ernisch/helmut-pilot
          test "$GITHUB_REPOSITORY_OWNER" = ernisch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_WORKFLOW_REF" = ernisch/helmut-pilot/.github/workflows/hetzner-native-automation.yml@refs/heads/main
          test "$HELMUT_NATIVE_CONTROL_MODE" = control-v1
          case "$HELMUT_NATIVE_OPERATION" in status|recipient|stage|admit) ;; *) exit 1 ;; esac
          [[ "$HELMUT_NATIVE_PLAN_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$HELMUT_NATIVE_PAYLOAD_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]

      - name: Fetch only reviewed public client and verify hardcoded source digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          gh api "repos/ernisch/helmut-pilot/contents/scripts/hetzner-native-automation-client.py?ref=$GITHUB_SHA" \
            --jq .content | base64 --decode > "$RUNNER_TEMP/helmut-native-client.py"
          printf '%s  %s\n' 16647fae58bc89c457113755dcd274f0bbd59558797d133e1e8eca14a779a87f "$RUNNER_TEMP/helmut-native-client.py" | sha256sum --check --status
          python3 -I "$RUNNER_TEMP/helmut-native-client.py" validate

      - name: Existing pinned Tailscale transport using short lived GitHub OIDC
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # same v4 commit as main probe
        with:
          oauth-client-id: ${{ vars.HELMUT_TS_CLIENT_ID }}
          audience: ${{ vars.HELMUT_TS_AUDIENCE }}
          tags: tag:helmut-ci-runner
          version: 1.104.2
          sha256sum: 512f613ed7d04fc7282f7dc5bd76aa105aae28168fbb9357eb749ebcbc29f0ae
          use-cache: 'false'
          retry: '1'
          args: --accept-dns=false
          log-mode: quiet

      - name: Disable routing and DNS before restricted SSH control request
        run: |
          set -euo pipefail
          sudo tailscale set --accept-routes=false --accept-dns=false
          sudo tailscale debug prefs | python3 -c 'import json,sys; p=json.load(sys.stdin); assert p.get("RouteAll") is False and p.get("CorpDNS") is False, "Tailscale routing/DNS settings rejected"'

      - name: Nonce bound public response over fixed forced command
        id: exchange
        continue-on-error: true
        env:
          HELMUT_CI_HOST: ${{ vars.HELMUT_CI_HOST }}
          HELMUT_CI_HOST_PUBLIC_KEY: ${{ vars.HELMUT_CI_HOST_PUBLIC_KEY }}
          HELMUT_CI_SSH_KEY: ${{ secrets.HELMUT_CI_SSH_KEY }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' 16647fae58bc89c457113755dcd274f0bbd59558797d133e1e8eca14a779a87f "$RUNNER_TEMP/helmut-native-client.py" | sha256sum --check --status
          python3 -I "$RUNNER_TEMP/helmut-native-client.py" client

      - name: Verify only fixed public artifact files without SSH secret environment
        id: verify
        if: ${{ always() && steps.exchange.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/helmut-native-public/RESPONSE.SAFE.json"
          test -f "$RUNNER_TEMP/helmut-native-public/RESPONSE.SAFE.sha256"
          cd "$RUNNER_TEMP/helmut-native-public"
          sha256sum --check --status RESPONSE.SAFE.sha256

      - name: Publish validated public JSON and exact SHA256 only
        if: ${{ always() && steps.verify.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # official GitHub v4.6.2, action.yml reviewed
        with:
          name: helmut-native-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/helmut-native-public/RESPONSE.SAFE.json
            ${{ runner.temp }}/helmut-native-public/RESPONSE.SAFE.sha256
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
          overwrite: false

      - name: Preserve validated failure artifact and fail the workflow
        if: ${{ always() && (steps.exchange.outcome != 'success' || steps.verify.outcome != 'success') }}
        run: exit 1
