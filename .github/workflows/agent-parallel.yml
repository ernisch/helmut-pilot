name: Agent Parallel Safety
on:
  pull_request:
    paths:
      - 'tools/agent-parallel/**'
      - '.github/workflows/agent-parallel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worktree-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Isolierte Worktrees sicher pruefen
        run: |
          python3 -B tools/agent-parallel/test_worktree.py
          python3 -B tools/agent-parallel/test_lease.py
