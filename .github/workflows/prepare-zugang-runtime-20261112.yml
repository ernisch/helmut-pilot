name: Zugangsmail-Laufzeitkorrektur vorbereiten
on:
  push:
    branches: [codex/passwortmail-laufzeit-20261112]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'ernisch/helmut-pilot' && github.event.before == '33459ec6072e484d9ab6a85e8e92b5cf90cda7ff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/passwortmail-laufzeit-20261112
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plattformabgrenzung vor jedem Produktpush isoliert pruefen
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/codex/passwortmail-laufzeit-20261112"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("lib/helmut/reset-timing.js")
          s = p.read_text()
          for before, after in [["const { waitUntil } = require(\"@vercel/functions\");\n\n",""],["// Antwortfenster in Millisekunden.","// Das Plattformpaket erst fuer die Passworthilfe laden. Der normale Node-Server\n// und isolierte Fachlaeufe brauchen keine Vercel-Abhaengigkeiten.\n// Der Server ruft dies fuer jede anonyme Anfrage VOR dem Lesen der Adresse auf,\n// damit der erste SDK-Import nicht von einem gefundenen Konto abhaengt.\nlet plattformWaitUntil;\nfunction bereiteLaufzeitVor(env = process.env) {\n  if (!plattformWaitUntil && env?.VERCEL === \"1\") {\n    plattformWaitUntil = require(\"@vercel/functions\").waitUntil;\n  }\n  return plattformWaitUntil;\n}\n\n// Antwortfenster in Millisekunden."],["  waitUntil(vorgang);","  const halten = bereiteLaufzeitVor();\n  if (halten) halten(vorgang);"],["  starteHintergrundarbeit,\n","  bereiteLaufzeitVor,\n  starteHintergrundarbeit,\n"]]:
              assert s.count(before) == 1, 'source anchor changed'
              s = s.replace(before, after)
          p.write_text(s)
          p = pathlib.Path("scripts/invite-smtp-transport-test.js")
          s = p.read_text()
          for before, after in [["    const handler = require(\"../server\"), accounts = require(\"../lib/helmut/accounts\");","    require(\"../lib/helmut/reset-timing\").bereiteLaufzeitVor({ VERCEL: \"1\" });\n    const handler = require(\"../server\"), accounts = require(\"../lib/helmut/accounts\");"],["(async () => {\n  const cfg = transport.transportKonfiguration(ENV);","(async () => {\n  const ohneSdk = [\n    'const assert = require(\"node:assert/strict\");',\n    'const Module = require(\"node:module\"), original = Module._load; let versuche = 0;',\n    'Module._load = function(name, ...args) { if (name === \"@vercel/functions\") { versuche++; throw Object.assign(new Error(\"Plattformpaket fehlt im isolierten Node-Server\"), {code:\"MODULE_NOT_FOUND\"}); } return original.call(this, name, ...args); };',\n    '(async () => { const t = require(\"./lib/helmut/reset-timing\"); await t.starteHintergrundarbeit(() => Promise.resolve()); await t.offeneArbeit(); assert.equal(versuche, 0); console.log(\"standalone-without-sdk-ok\"); })().catch(() => { process.exitCode = 1; });'\n  ].join(\"\\n\");\n  const lokal = spawnSync(process.execPath, [path.join(__dirname, \"lokal.js\"), \"--\", process.execPath, \"-e\", ohneSdk],\n    { cwd: path.resolve(__dirname, \"..\"), env: { ...process.env, VERCEL: \"\" }, encoding: \"utf8\", timeout: 10000 });\n  check(\"Normaler isolierter Node-Server startet und beendet Hintergrundarbeit ohne Vercel-Paket\",\n    lokal.status === 0 && lokal.stdout.includes(\"standalone-without-sdk-ok\"));\n  const cfg = transport.transportKonfiguration(ENV);"]]:
              assert s.count(before) == 1, 'source anchor changed'
              s = s.replace(before, after)
          p.write_text(s)
          p = pathlib.Path("server.js")
          s = p.read_text()
          for before, after in [["    return sendTooManyRequests(response);\n  }\n  const beginn = Date.now();","    return sendTooManyRequests(response);\n  }\n  resetTiming.bereiteLaufzeitVor();\n  const beginn = Date.now();"]]:
              assert s.count(before) == 1, 'source anchor changed'
              s = s.replace(before, after)
          p.write_text(s)
          PY
          npm ci --ignore-scripts --no-audit
          node scripts/lokal.js scripts/invite-smtp-transport-test.js
          node scripts/lokal.js -- node scripts/run-offline-tests.js --extended --only reset
          npm audit --omit=dev --audit-level=high
          git diff --check
          git diff --name-only | LC_ALL=C sort > /tmp/changed-files
          printf 'lib/helmut/reset-timing.js\nscripts/invite-smtp-transport-test.js\nserver.js\n' | cmp --silent - /tmp/changed-files
          git add lib/helmut/reset-timing.js scripts/invite-smtp-transport-test.js server.js
          git -c user.name="Helmut build" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Vercel-Paket auf Passworthilfe begrenzen und ohne SDK gegenpruefen [skip vercel]"
          git push origin HEAD:refs/heads/codex/passwortmail-laufzeit-20261112
          printf 'prepared_compatibility_commit=%s\n' "$(git rev-parse HEAD)"
