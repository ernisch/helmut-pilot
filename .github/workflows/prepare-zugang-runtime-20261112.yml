name: Zugangsmail-Laufzeitkorrektur vorbereiten
on:
  push:
    branches: [codex/passwortmail-laufzeit-20261112]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'ernisch/helmut-pilot' && github.event.before == 'dc20e1948d3c4c25847b7bd5e528da4580a30fa1' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/passwortmail-laufzeit-20261112
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gepinntes Vercel SDK mit npm installieren und gezielt isoliert pruefen
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/codex/passwortmail-laufzeit-20261112"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import base64,pathlib
          pathlib.Path("lib/helmut/reset-timing.js").write_bytes(base64.b64decode(""))
          pathlib.Path("scripts/invite-smtp-transport-test.js").write_bytes(base64.b64decode(""))
          PY
          npm install --package-lock-only --ignore-scripts --save-exact @vercel/functions@3.10.4
          npm ci --ignore-scripts --no-audit
          node scripts/lokal.js scripts/invite-smtp-transport-test.js
          node scripts/lokal.js -- node scripts/run-offline-tests.js --extended --only reset
          npm audit --omit=dev --audit-level=high
          git diff --check
          git diff --name-only | LC_ALL=C sort > /tmp/changed-files
          printf 'lib/helmut/reset-timing.js\npackage-lock.json\npackage.json\nscripts/invite-smtp-transport-test.js\n' | cmp --silent - /tmp/changed-files
          git add lib/helmut/reset-timing.js scripts/invite-smtp-transport-test.js package.json package-lock.json
          git -c user.name="Helmut build" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Zugangsmail bis zum Abschluss halten und SDK mit npm binden [skip vercel]"
          git push origin HEAD:refs/heads/codex/passwortmail-laufzeit-20261112
          printf 'prepared_dependency_commit=%s\n' "$(git rev-parse HEAD)"
