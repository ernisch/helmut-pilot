name: "500 Testprofile: Zugang nur lesen"

# Ein reiner Zugriffsnachweis, kein Ausfuehrer fuer Fachlaeufe oder Profilwrites.
# Der enge Branchtrigger dient genau der ersten Pruefung ohne lokalen Rechner.
# Keine Secrets bei Pull Requests, Forks, Zeitplaenen oder auf fremden Branches.
on:
  workflow_dispatch:
    inputs:
      laufzeit_status:
        description: "Neue Statusroute lesen, erst nach bestaetigtem Production READY"
        type: boolean
        default: false
      production_commit:
        description: "Vollstaendiger als Production READY bestaetigter Commit des ausgewaehlten Branches"
        type: string
        required: false
  push:
    branches: [codex/500-github-zugangspruefung]
    paths:
      - .github/workflows/500-zugangspruefung.yml
      - scripts/github-zugangspruefung.js

permissions:
  contents: read

concurrency:
  group: helmut-500-zugangspruefung
  cancel-in-progress: false

jobs:
  zugang:
    if: >-
      github.repository == 'ernisch/helmut-pilot' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/codex/500-github-zugangspruefung')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: checkout
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        id: node
        with:
          node-version: "22"
      - name: Geprueften reinen Leser ausfuehren
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HELMUT_CRON_SECRET: ${{ secrets.HELMUT_CRON_SECRET }}
          HELMUT_STORAGE_BACKEND: ${{ vars.HELMUT_STORAGE_BACKEND }}
          HELMUT_V3_STORE: ${{ vars.HELMUT_V3_STORE }}
          HELMUT_PROFILE_DB_MODE: ${{ vars.HELMUT_PROFILE_DB_MODE }}
          HELMUT_CRAWL_RUN_RETENTION: ${{ vars.HELMUT_CRAWL_RUN_RETENTION }}
          HELMUT_MAX_LLM_CALLS_PER_DAY: ${{ vars.HELMUT_MAX_LLM_CALLS_PER_DAY }}
          HELMUT_LLM_RESERVE_UNDERSTANDING: ${{ vars.HELMUT_LLM_RESERVE_UNDERSTANDING }}
          HELMUT_TESTLAUF_KOMMUNIKATION: ${{ vars.HELMUT_TESTLAUF_KOMMUNIKATION }}
        run: node scripts/github-zugangspruefung.js
      - name: Production Laufzeitkonfiguration ausschliesslich lesen
        # Die reine Konfigurationsroute benoetigt keine Datenbankverbindung.
        # Ein fehlgeschlagener Datenbankabruf bleibt trotzdem ein Jobfehler.
        if: >-
          ${{ !cancelled() && steps.checkout.outcome == 'success' &&
              steps.node.outcome == 'success' &&
              github.event_name == 'workflow_dispatch' && inputs.laufzeit_status }}
        env:
          HELMUT_CRON_SECRET: ${{ secrets.HELMUT_CRON_SECRET }}
          HELMUT_PRODUCTION_COMMIT: ${{ inputs.production_commit }}
        run: node scripts/github-laufzeitpruefung.js
