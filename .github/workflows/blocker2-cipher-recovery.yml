name: "Blocker 2: serverseitige Cipher-Aufbewahrung90"
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: helmut-blocker2-handoff-retention90
  cancel-in-progress: false
jobs:
  transport:
    if: github.repository == 'ernisch/helmut-pilot' && github.ref == 'refs/heads/codex/blocker2-server-handoff-20261008' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Ausschliesslich28 vorhandene gepinnte Cipher-ZIPs kopieren
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/blocker2-handoff-copy.py
      - name: Bytegleiche Cipher-Originale90 Tage sichern
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blocker2-handoff-37790661298-original-cipher90
          path: tmp/blocker2-handoff-original-cipher/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
