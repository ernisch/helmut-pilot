name: "Blocker 2: vorhandenen Cipherbeleg transportieren"
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: helmut-blocker2-cipher-recovery
  cancel-in-progress: false
jobs:
  transport:
    if: github.repository == 'ernisch/helmut-pilot' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Ausschliesslich fest gebundenes vorhandenes GitHub-Cipherarchiv lesen
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/blocker2-cipher-recovery.py
      - name: Original-Cipherdateien unveraendert in kleine Pakete teilen
        id: pack
        run: node scripts/blocker2-cipher-parts.js wiederhergestellt
      - name: Cipherpaket 01 sichern
        if: always() && steps.pack.outcome == 'success' && fromJSON(steps.pack.outputs.part_count) >= 1
        uses: actions/upload-artifact@v4
        with:
          name: blocker2-readonly500-${{ github.run_id }}-part-01
          path: tmp/blocker2-cipher-parts/01/*.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false
      - name: Cipherpaket 02 sichern
        if: always() && steps.pack.outcome == 'success' && fromJSON(steps.pack.outputs.part_count) >= 2
