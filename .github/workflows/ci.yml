            exit 1
          fi
      - name: Bestehende Cipherteile und alle zwoelf Originalpins pruefen
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          HELMUT_W15_CIPHER_INDEX_GPG: ${{ inputs.w15_cipher_index }}
          HELMUT_W15_RECEIVER_PROTECTED_KEY_B64: ${{ secrets.HELMUT_W15_RECEIVER_PROTECTED_KEY_B64 }}
          HELMUT_W15_RECEIVER_PASSPHRASE: ${{ secrets.HELMUT_W15_RECEIVER_PASSPHRASE }}
        run: python3 -B scripts/w15-github/receive_existing_inputs.py --receive-existing-inputs-only --expected-commit "$EXPECTED_COMMIT" --runner-temp "$RUNNER_TEMP"
      - name: Reichweite des Originalempfangs festhalten
        shell: bash
        run: |
          echo 'Nur bestehender verschluesselter Bestand und vollstaendige zwoelf Dateipins; keine Datenbank oder Controller.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Kein Artefakt-/Cacheupload. Restore, gemeinsamer Lebenszeit-RAM-Nachweis und End500/Mock500 bleiben offen.' >> "$GITHUB_STEP_SUMMARY"

  w15-isolated:
    name: W15 gemeinsamer Runner — getrennt gesperrter Restore und End500
    if: github.event_name == 'workflow_dispatch' && (inputs.w15_mode == 'end500-restore-synthetic' || inputs.w15_mode == 'end500-restore-gated' || inputs.w15_mode == 'end500-restore-export-diagnostic' || inputs.w15_mode == 'end500-full-gated')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: helmut-ci-originals
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Vorhandene gepinnte Werkzeuge und Image bereitstellen
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/w15-image"
          cp "$(command -v node)" "$RUNNER_TEMP/w15-image/node"
          curl -fsSL --max-time 90 -o "$RUNNER_TEMP/w15-postgrest.tar.xz" https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz
          echo "9f71269e61ac3a940281e93ff415760f5957e430e475ba4c3889f3ede7d5527c  $RUNNER_TEMP/w15-postgrest.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/w15-postgrest.tar.xz" -C "$RUNNER_TEMP/w15-image"
          echo "bc17c508ffeed0ec622934f9b7fa72f8e78da65350e63c3eceb56fa688aa5e12  $RUNNER_TEMP/w15-image/node" | sha256sum -c -
          echo "870a77f49508479bc87c5504b6b0c3715c7220926932d916b0d73952b297c617  $RUNNER_TEMP/w15-image/postgrest" | sha256sum -c -
          cp scripts/auth-usage-split.Dockerfile "$RUNNER_TEMP/w15-image/Dockerfile"
          docker build -t helmut-w15-existing:20261029 "$RUNNER_TEMP/w15-image"
          echo "W15_IMAGE_ID=$(docker image inspect --format '{{.Id}}' helmut-w15-existing:20261029)" >> "$GITHUB_ENV"
          echo "W15_NODE_SOURCE=$RUNNER_TEMP/w15-image/node" >> "$GITHUB_ENV"
          echo "W15_POSTGREST_SOURCE=$RUNNER_TEMP/w15-image/postgrest" >> "$GITHUB_ENV"
      - name: Einmaligen Ablauf gebunden ausfuehren — ohne passende Freigabe gesperrt
        uses: ./.github/actions/w15-isolated
        env:
          W15_MODE: ${{ inputs.w15_mode }}
          W15_REQUEST: ${{ inputs.w15_request }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          HELMUT_W15_CIPHER_INDEX_GPG: ${{ inputs.w15_cipher_index }}
          HELMUT_W15_RECEIVER_PROTECTED_KEY_B64: ${{ inputs.w15_mode != 'end500-restore-synthetic' && secrets.HELMUT_W15_RECEIVER_PROTECTED_KEY_B64 || '' }}
          HELMUT_W15_RECEIVER_PASSPHRASE: ${{ inputs.w15_mode != 'end500-restore-synthetic' && secrets.HELMUT_W15_RECEIVER_PASSPHRASE || '' }}
          GITHUB_TOKEN: ${{ github.token }}

  mock500-runner-synthetic:
    name: Mock500 v2 Runner — nur neue synthetische Anbindung
    if: github.event_name == 'workflow_dispatch' && inputs.w15_mode == 'mock500-runner-synthetic'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/w15-existing-tools
      - uses: ./.github/actions/w15-mock500
        env:
          W15_MODE: ${{ inputs.w15_mode }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}

  mock500-full-gated:
    name: Mock500 v2 — getrenntes GO und positive End500-Abnahme erforderlich
    if: github.event_name == 'workflow_dispatch' && inputs.w15_mode == 'mock500-full-gated'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: helmut-ci-originals
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/w15-existing-tools
      - uses: ./.github/actions/w15-mock500
        env:
          W15_MODE: ${{ inputs.w15_mode }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          HELMUT_W15_RECEIVER_PROTECTED_KEY_B64: ${{ secrets.HELMUT_W15_RECEIVER_PROTECTED_KEY_B64 }}
          HELMUT_W15_RECEIVER_PASSPHRASE: ${{ secrets.HELMUT_W15_RECEIVER_PASSPHRASE }}
          GITHUB_TOKEN: ${{ github.token }}

  mock500-receive-originals:
    name: Mock500 Originalarchiv empfangen — kein Restore oder Controller
    if: github.event_name == 'workflow_dispatch' && inputs.w15_mode == 'mock500-receive-originals'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: helmut-ci-originals
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Einmalige separat freigegebene Annahme der elf Originaldateien
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          HELMUT_W15_CIPHER_INDEX_GPG: ${{ inputs.w15_cipher_index }}
          HELMUT_W15_RECEIVER_PROTECTED_KEY_B64: ${{ secrets.HELMUT_W15_RECEIVER_PROTECTED_KEY_B64 }}
          HELMUT_W15_RECEIVER_PASSPHRASE: ${{ secrets.HELMUT_W15_RECEIVER_PASSPHRASE }}
        run: python3 -B scripts/w15-github/mock500_archive_receive.py --receive-mock-originals-only --expected-commit "$EXPECTED_COMMIT" --runner-temp "$RUNNER_TEMP"
      - name: Reichweite der Empfangsquittung
        run: |
          echo 'Nur elf hashgepruefte Originaldateien im aktuellen privaten Runner. Kein Artefakt oder Cache.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Spaeterer Mock500 empfaengt das unveraenderte Cipherarchiv erneut im eigenen gemeinsamen Job; kein Runner-Uebergang.' >> "$GITHUB_STEP_SUMMARY"
