          echo 'Client, Styles, Auth und Renderer unveraendert; Fach-Gap lokal geprueft, kein neuer Chromiumlauf/PASS.' >> "$GITHUB_STEP_SUMMARY"
      - name: Artikelautonom - vorhandene Browserbelege unveraendert erhalten
        if: steps.plan.outputs.artikelautonom == 'true'
        run: |
          echo 'Client, Styles, Auth, Bereichstrennung und gespeicherter Paketleser unveraendert; neue API-Erklaerung lokal geprueft, kein neuer Chromiumlauf/PASS.' >> "$GITHUB_STEP_SUMMARY"
      - name: Fachthemen - vorhandene Browserbelege unveraendert erhalten
        if: steps.plan.outputs.fachthemen == 'true'
        run: |
          echo 'App, UI, Auth und gespeicherter Paketleser unveraendert; kein neuer Chromiumlauf/PASS. Historische Browserbelege erhalten.' >> "$GITHUB_STEP_SUMMARY"
      - name: Abhängigkeiten installieren (aus package-lock.json)
        if: steps.plan.outputs.browser == 'true' || steps.plan.outputs.lieferreparatur == 'true' || steps.plan.outputs.lageteilstand == 'true' || steps.plan.outputs.kundenansichten == 'true' || steps.plan.outputs.briefingfenster == 'true' || steps.plan.outputs.radarartikel == 'true'
        run: npm ci
      - name: Playwright + Chromium installieren
        if: steps.plan.outputs.browser == 'true' || steps.plan.outputs.lieferreparatur == 'true' || steps.plan.outputs.lageteilstand == 'true' || steps.plan.outputs.kundenansichten == 'true' || steps.plan.outputs.briefingfenster == 'true' || steps.plan.outputs.radarartikel == 'true'
        run: |
          # Version gepinnt (Review-Fix): ohne Pin zöge jeder CI-Lauf die neueste
          # Playwright/Chromium-Version — ein Release könnte das Merge-Gate ohne
          # Codeänderung rot/fälschlich grün machen. Bei Playwright-Update hier
          # bewusst anheben.
          npm i --no-save playwright@1.56.1
          # Playwright liefert seinen eigenen gepinnten Chromium. Eine fremde
          # Google-Chrome-APT-Liste lieferte am 09.09. falsche Hashes und
          # blockierte bereits apt update. Nur diese unbenoetigte Liste wird
          # im kurzlebigen Testrechner reversibel aus der APT-Auswahl genommen.
          # Pruefsummen, Ubuntu-Abhaengigkeiten und Browserpflicht bleiben aktiv.
          sudo python3 - <<'PY'
          from pathlib import Path
          import re
          for source in Path('/etc/apt/sources.list.d').iterdir():
              if source.suffix not in ('.list', '.sources'):
                  continue
              lines = [line.strip() for line in source.read_text().splitlines()
                       if line.strip() and not line.lstrip().startswith('#')]
              urls = re.findall(r'https?://[^\s\]]+', '\n'.join(lines))
              if urls and all(re.fullmatch(r'https?://dl\.google\.com/linux/chrome(?:-stable)?/deb/?', url) for url in urls):
                  source.rename(source.with_name(source.name + '.helmut-ci-disabled'))
                  print('Unbenoetigte Chrome Paketliste isoliert:', source.name)
          PY
          npx playwright install --with-deps chromium
      - name: Kundenansichten - neue sichtbare Lage und ehrlicher Radarbestand
        if: steps.plan.outputs.kundenansichten == 'true'
        env:
          HELMUT_SOURCE_MODE: "off"
          HELMUT_REQUIRE_BROWSER: "1"
        run: node scripts/lokal.js scripts/browser-smoke-test.js --kundenansichten
      - name: Briefingfenster - neuer gepruefter Teilstand Desktop und Mobil
        if: steps.plan.outputs.briefingfenster == 'true'
        env:
          HELMUT_REQUIRE_BROWSER: "1"
          HELMUT_SOURCE_MODE: "off"
        run: node scripts/lokal.js scripts/browser-smoke-test.js --briefing-teilstand
      - name: Quellenbedarf - gebundenen echten Browserbeleg erhalten
        if: steps.plan.outputs.quellenbedarf == 'true'
        run: |
          echo 'Server, UI und Browserdateien im vollstaendigen Baum unveraendert; Delta im reinen Archivadapter durch RSS-/Finding-/Speicherbelege gezielt geprueft. Kein neuer Chromiumlauf oder Browser-PASS behauptet.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Echter Desktop-/Mobilbeleg PR1246: https://github.com/ernisch/helmut-pilot/actions/runs/44065530896/job/133978126070' >> "$GITHUB_STEP_SUMMARY"
      - name: Quellenreadback - gebundenen echten Browserbeleg erhalten
        if: steps.plan.outputs.quellenreadback == 'true'
        run: |
          echo 'Server, UI und Browserdateien im vollstaendigen Baum unveraendert gebunden; kein neuer Chromiumlauf oder Browser-PASS behauptet.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Echter Desktop-/Mobilbeleg: https://github.com/ernisch/helmut-pilot/actions/runs/43892439933/job/133386953203' >> "$GITHUB_STEP_SUMMARY"
      - name: Quellenoperator - gebundenen echten Browserbeleg erhalten
        if: steps.plan.outputs.quellenoperator == 'true'
        run: |
          echo 'Unveraenderte UI-/Browserdateien im vollstaendigen Baum gebunden; Serveraenderung nur neue geschuetzte Operatorroute/Planung, gezielt HTTP-geprueft. Kein neuer Chromiumlauf oder Browser-PASS behauptet.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Echter Desktop-/Mobilbeleg: https://github.com/ernisch/helmut-pilot/actions/runs/43892439933/job/133386953203' >> "$GITHUB_STEP_SUMMARY"
      - name: Bmgdirekt - gebundenen echten Browserbeleg erhalten
        if: steps.plan.outputs.bmgdirekt == 'true'
        run: |
          echo 'Unveraenderte UI-/HTTP-Ausgabe-/Browserdateien im vollstaendigen Baum gebunden; kein neuer Chromiumlauf oder Browser-PASS behauptet.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Echter Desktop-/Mobilbeleg: https://github.com/ernisch/helmut-pilot/actions/runs/43892439933/job/133386953203' >> "$GITHUB_STEP_SUMMARY"
      - name: Quellenmorgen - gebundenen echten Browserbeleg erhalten
        if: steps.plan.outputs.quellenmorgen == 'true'
        run: |
          echo 'Unveraenderte UI-/HTTP-Ausgabe-/Browserdateien im vollstaendigen Baum gebunden; kein neuer Chromiumlauf oder Browser-PASS behauptet.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Echter Desktop-/Mobilbeleg: https://github.com/ernisch/helmut-pilot/actions/runs/43892439933/job/133386953203' >> "$GITHUB_STEP_SUMMARY"
      - name: Briefingfolge - aktueller Teilstand trotz neuerem Paket Desktop und Mobil
        if: steps.plan.outputs.briefingfolge == 'true'
        env:
          HELMUT_REQUIRE_BROWSER: "1"
          HELMUT_SOURCE_MODE: "off"
        run: node scripts/lokal.js -- node scripts/browser-smoke-test.js --briefing-teilstand
      - name: Lagearbeit - gebundenen echten Browserbeleg erhalten
        if: steps.plan.outputs.lagearbeit == 'true'
        run: |
          echo 'Unveraenderte UI-/Reader-/Browserdateien im vollstaendigen Baum gebunden; kein neuer Chromiumlauf oder Browser-PASS behauptet.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Echter Desktop-/Mobilbeleg: https://github.com/ernisch/helmut-pilot/actions/runs/43879845894/job/133342494198' >> "$GITHUB_STEP_SUMMARY"
      - name: Lagemandat - gespeicherte persoenliche Lage Desktop und Mobil
        if: steps.plan.outputs.lagemandat == 'true'
        env:
          HELMUT_REQUIRE_BROWSER: "1"
          HELMUT_SOURCE_MODE: "off"
        run: node scripts/lokal.js -- node scripts/browser-smoke-test.js --kundenansichten
      - name: Radarpartei - gespeicherte Fremdparteikarte sperren Desktop und Mobil
        if: steps.plan.outputs.radarpartei == 'true'
        env:
          HELMUT_REQUIRE_BROWSER: "1"
          HELMUT_SOURCE_MODE: "off"
        run: node scripts/lokal.js -- node scripts/browser-smoke-test.js --radar-artikelbindung
      - name: Radarartikel - neue Artikelbindung Desktop und Mobil
        if: steps.plan.outputs.radarartikel == 'true'
        env:
          HELMUT_REQUIRE_BROWSER: "1"
          HELMUT_SOURCE_MODE: "off"
        run: node scripts/lokal.js scripts/browser-smoke-test.js --radar-artikelbindung
      - name: Radar - bestaetigten Browserbeleg wiederverwenden
        if: steps.plan.outputs.tagesfrische == 'true'
        run: |
          {
            echo 'Sieben Radar-Klarheitschecks Desktop/Mobil bereits bestanden, nicht erneut ausgefuehrt.'
            echo 'Unveraenderte Produkt-/Browserblobs sind im exakten vollstaendigen PR-Baum gebunden.'
            echo 'Original: https://github.com/ernisch/helmut-pilot/actions/runs/43537245306/job/132269105907'
            echo 'Kein Chromium installiert oder gestartet, kein neuer Browser-PASS behauptet.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Teilstand - neuer gespeicherter Lagefall Desktop und Mobil
        if: steps.plan.outputs.lageteilstand == 'true'
        env:
          HELMUT_REQUIRE_BROWSER: "1"
          HELMUT_SOURCE_MODE: "off"
        run: |
          echo 'Nur neuer hashgebundener Lage-Teilstand auf Desktop/Mobil; alte Fach-/Browser-/Mengenfaelle bleiben erhalten und werden nicht erneut ausgefuehrt. Kein Vollversorgungsnachweis.' >> "$GITHUB_STEP_SUMMARY"
          node scripts/lokal.js -- node scripts/browser-smoke-test.js --tagespaket-teilstand
      - name: Lieferreparatur - neuer Tagespaket JSONB Browserweg
        if: steps.plan.outputs.lieferreparatur == 'true'
        env:
          HELMUT_REQUIRE_BROWSER: "1"
          HELMUT_SOURCE_MODE: "off"
        run: |
          echo '13 erfolgreiche Browser-Einzelpruefungen als Teilbeleg WIEDERVERWENDET aus https://github.com/ernisch/helmut-pilot/actions/runs/43511072972/job/132181165997 ; damaliger Gesamtjob FAIL wegen zweier Ruhelage-Timingfaelle, hier keine Umwertung.' >> "$GITHUB_STEP_SUMMARY"
          node scripts/lokal.js -- node scripts/browser-smoke-test.js --tagespaket-jsonb --nur-ruhelage
      - name: Browser-Smoke (Desktop + Mobil, lokaler In-Process-Server)
        if: steps.plan.outputs.browser == 'true' && steps.plan.outputs.radarpartei != 'true' && steps.plan.outputs.lagemandat != 'true' && steps.plan.outputs.briefingfolge != 'true' && steps.plan.outputs.quellenbedarf != 'true'
        # Fail-closed (Audit-Folgebranch): GitHub setzt CI=true automatisch,
        # womit browser-smoke-test.js bei fehlendem Playwright bereits mit
        # Exit 1 abbricht statt still zu SKIPpen. Das Flag macht die Pflicht
        # zusätzlich explizit und unabhängig vom CI-Env-Verhalten.
        env:
          HELMUT_REQUIRE_BROWSER: "1"
          # Gleicher Grund wie oben: der Quellenmodus wird ausdrücklich als "off" erklärt.
          HELMUT_SOURCE_MODE: "off"
        run: node scripts/lokal.js -- node scripts/browser-smoke-test.js
      - name: Getrennte Prosa in beiden App Ansichten (Chromium, hell und dunkel)
        if: steps.plan.outputs.browser == 'true' && steps.plan.outputs.radarpartei != 'true' && steps.plan.outputs.lagemandat != 'true' && steps.plan.outputs.briefingfolge != 'true' && steps.plan.outputs.quellenbedarf != 'true'
        env:
          HELMUT_REQUIRE_BROWSER: "1"
          HELMUT_SOURCE_MODE: "off"
        run: node scripts/lokal.js -- node scripts/prosa-vorschau-test.js

      - name: Gespeichertes Tagespaket - gebundenen Browserbeleg wiederverwenden
        if: steps.plan.outputs.verarbeitungskern == 'true'
        run: |
          {
            echo '### Tagespaket-Browserbeleg: WIEDERVERWENDET, NICHT ERNEUT AUSGEFUEHRT'
            echo '29/29 Desktop-/Mobilpruefungen: https://github.com/ernisch/helmut-pilot/actions/runs/43483196284'
            echo 'Ursprung f7f3d6eb086fa7b8200f6d3628b950b42032ae85; Run, Browserjob und Paketpruefschritt weiterhin erfolgreich.'
            echo 'Hier geprueft: aktueller PR-/Checkout-Kopf, exakte SQL-Nachtragsblobs und unveraenderter Browser-/Anwendungsbaum.'
            echo 'In diesem Job kein Chromium installiert oder gestartet; kein neuer Browser-PASS behauptet.'
          } >> "$GITHUB_STEP_SUMMARY"

  synthetic-resource-diagnostic:
    name: Mock100 — einmalig, synthetisch und ohne Anbieteraufrufe
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'mock100'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Erfolgreiche Pflicht-CI des exakten Kandidaten nachweisen
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          PREREQUISITE_CI_RUN: ${{ inputs.prerequisite_ci_run_id }}
          MOCK100_NONCE: ${{ inputs.mock100_nonce }}
        run: |
          python3 - <<'PY'
          import json, os, re, uuid, urllib.request
          e=os.environ
          expected=e['EXPECTED_COMMIT']; run=e['PREREQUISITE_CI_RUN']; nonce=e['MOCK100_NONCE']
          assert re.fullmatch('[a-f0-9]{40}',expected) and expected==e['GITHUB_SHA']
          assert e['GITHUB_REPOSITORY']=='ernisch/helmut-pilot' and e['GITHUB_RUN_ATTEMPT']=='1'
          assert e['GITHUB_REF']=='refs/heads/codex/mock100-local-20261105'
          assert re.fullmatch('[1-9][0-9]{0,19}',run) and run!=e['GITHUB_RUN_ID']
          n=uuid.UUID(nonce); assert str(n)==nonce and n.version==4
          base='https://api.github.com/repos/ernisch/helmut-pilot/actions/runs/'+run
          def read(url):
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+e['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=20) as response:
                  assert response.status==200
                  return json.load(response)
          result=read(base)
          assert result['head_sha']==expected and result['status']=='completed' and result['conclusion']=='success'
          assert result['event']=='pull_request' and result['path']=='.github/workflows/ci.yml'
          jobs=read(base+'/jobs?per_page=100')
          assert jobs['total_count']<=100
          for name in ('Syntax + Offline-Suiten','Browser-/Mobile-Smoke (Chromium)'):
              matching=[j for j in jobs['jobs'] if j['name']==name]
              assert len(matching)==1 and matching[0]['status']=='completed' and matching[0]['conclusion']=='success'
              if name=='Syntax + Offline-Suiten':
                  native=[s for s in matching[0]['steps'] if s['name']=='Mock100 native Anschlussprobe (nur drei synthetische Profile)']
                  assert len(native)==1 and native[0]['status']=='completed' and native[0]['conclusion']=='success'
          print('PASS: beide Pflichtchecks auf exakt '+expected+'; Run '+run)
          request={'schema':'helmut-mock100-request/1','scope':'ORIGINAL_FREE_SYNTHETIC_100_MOCK_ONLY',
                   'expectedCommit':expected,'nonce':nonce,'profiles':100,'attempt':1,'maxSeconds':1800}
          with open(e['GITHUB_ENV'],'a') as output:
              output.write('W15_DIAGNOSTIC_REQUEST='+json.dumps(request,separators=(',',':'))+'\n')
          PY
      - uses: ./.github/actions/w15-existing-tools
        with:
          native-vector-diagnostic: 'true'
      - name: Vorhandene Anwendungsabhaengigkeiten aus dem Lockfile
        run: npm ci
      - name: Genau ein vollstaendiger Mock100
        timeout-minutes: 32
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          sudo -n env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 \
            PYTHONDONTWRITEBYTECODE=1 GITHUB_ACTIONS=true GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REF="$GITHUB_REF" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" EXPECTED_COMMIT="$EXPECTED_COMMIT" \
            RUNNER_TEMP="$RUNNER_TEMP" W15_IMAGE_ID="$W15_IMAGE_ID" W15_NODE_SOURCE="$W15_NODE_SOURCE" \
            W15_POSTGREST_SOURCE="$W15_POSTGREST_SOURCE" W15_DIAGNOSTIC_REQUEST="$W15_DIAGNOSTIC_REQUEST" \
            /usr/bin/python3 -I -B scripts/w15-github/synthetic_resource_diagnostic.py \
              --qualify-and-run-once --expected-commit "$EXPECTED_COMMIT"
      - name: Geschlossene Mock100-Belege dauerhaft als GitHub-Check sichern
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_HEAD_SHA: ${{ github.sha }}
        run: |
          sudo -n --preserve-env=GITHUB_ACTIONS,GITHUB_TOKEN,GITHUB_REPOSITORY,GITHUB_SHA,SOURCE_HEAD_SHA,GITHUB_RUN_ID,GITHUB_EVENT_NAME,GITHUB_REF,GITHUB_HEAD_REF,RUNNER_TEMP,GITHUB_STEP_SUMMARY \
            /usr/bin/python3 -I -B scripts/w15-github/publish_synthetic_resource_receipt.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mock100-${{ github.run_id }}
          path: ${{ runner.temp }}/mock100.PUBLIC.json
          if-no-files-found: error
          retention-days: 90
