            || [ "${HELMUT_CI_PR_HEAD_REF:-${GITHUB_REF#refs/heads/}}" = codex/quellen-operator-20261117 ] \
            || { [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] \
              && { [ "$(git log -1 --format=%s)" = 'fix(quellen): geschützten Operatorstart und fehlende BMG-Planung ermöglichen (#1243)' ] \
                || [ "$(git rev-parse HEAD^1)" = 18d1909374d0d79321a6f1ae6631dea174e0cdcf ]; }; }; then
            node scripts/ci-quellenoperator-plan.js --github-output "$GITHUB_OUTPUT"
            exit 0
