name: CI — Offline-Suite + Browser-Smoke

# =============================================================================
# Blockierendes CI-Gate für den KERN (Audit-Fix 2026-07, Sprint 5).
# Vorher führte KEIN Workflow die Offline-Testsuiten bei PR/Push aus — eine
# Regression in server.js/client.js/lib erreichte ungeprüft main und Production.
#
# GRENZEN (hart): KEINE Secrets, KEINE Supabase-Verbindung, KEIN LLM, KEIN
# Deployment. Alle Suiten laufen offline (DB/fetch gemockt bzw. lokaler Server).
#
# DAMIT DAS GATE BLOCKIERT, muss der Betreiber EINMALIG Branch Protection
# aktivieren (GitHub → Settings → Branches → Add branch protection rule):
#   Branch: main
#   [x] Require status checks to pass before merging
#       -> "Syntax + Offline-Suiten" und "Browser-/Mobile-Smoke (Chromium)"
#   [x] Require branches to be up to date before merging
# =============================================================================

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      w15_mode:
        description: 'Standard-CI oder begrenzte W15-Vorbereitung; kein End500-Start'
        type: choice
        options: [standard, end500-plan, end500-parent-probe, end500-handoff-canary, end500-receiver-check, end500-receive-inputs, end500-restore-synthetic, end500-restore-gated, end500-restore-export-diagnostic, end500-full-gated, mock500-runner-synthetic, mock500-full-gated, mock500-receive-originals]
        default: standard
      w15_request:
        description: 'Oeffentliche laufgebundene Qualifikation und getrennte Freigabe; keine Geheimnisse'
        type: string
        default: ''
      expected_commit:
        description: 'Bei W15-Vorbereitung: exakt gepruefter 40-stelliger Commit des gewaehlten Refs'
        type: string
        default: ''
      w15_cipher_index:
        description: 'Nur GPG-verschluesselter Downloadindex fuer den vorhandenen Empfaenger; niemals Klartextadressen'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}${{ (inputs.w15_mode == 'end500-plan' || inputs.w15_mode == 'end500-parent-probe' || inputs.w15_mode == 'end500-handoff-canary' || inputs.w15_mode == 'end500-receiver-check' || inputs.w15_mode == 'end500-receive-inputs' || inputs.w15_mode == 'end500-restore-synthetic' || inputs.w15_mode == 'end500-restore-gated' || inputs.w15_mode == 'end500-restore-export-diagnostic' || inputs.w15_mode == 'end500-full-gated' || inputs.w15_mode == 'mock500-runner-synthetic' || inputs.w15_mode == 'mock500-full-gated' || inputs.w15_mode == 'mock500-receive-originals') && format('-w15-{0}', inputs.w15_mode) || '' }}
  cancel-in-progress: ${{ inputs.w15_mode != 'end500-plan' && inputs.w15_mode != 'end500-parent-probe' && inputs.w15_mode != 'end500-handoff-canary' && inputs.w15_mode != 'end500-receiver-check' && inputs.w15_mode != 'end500-receive-inputs' && inputs.w15_mode != 'end500-restore-synthetic' && inputs.w15_mode != 'end500-restore-gated' && inputs.w15_mode != 'end500-restore-export-diagnostic' && inputs.w15_mode != 'end500-full-gated' && inputs.w15_mode != 'mock500-runner-synthetic' && inputs.w15_mode != 'mock500-full-gated' && inputs.w15_mode != 'mock500-receive-originals' }}

jobs:
  offline-suite:
    if: github.event_name != 'workflow_dispatch' || (inputs.w15_mode != 'end500-plan' && inputs.w15_mode != 'end500-parent-probe' && inputs.w15_mode != 'end500-handoff-canary' && inputs.w15_mode != 'end500-receiver-check' && inputs.w15_mode != 'end500-receive-inputs' && inputs.w15_mode != 'end500-restore-synthetic' && inputs.w15_mode != 'end500-restore-gated' && inputs.w15_mode != 'end500-restore-export-diagnostic' && inputs.w15_mode != 'end500-full-gated' && inputs.w15_mode != 'mock500-runner-synthetic' && inputs.w15_mode != 'mock500-full-gated' && inputs.w15_mode != 'mock500-receive-originals')
    name: Syntax + Offline-Suiten
    runs-on: ubuntu-latest
    # CI35207010979: 397/397 Suiten erfolgreich in779s, aber inklusive Setup
    # und Kontoschutz am15-Minuten-Jobende abgebrochen; Z22 wurde uebersprungen.
    # Endliches Gesamtfenster fuer ALLE Pflichtschritte; Suiten und ihre
    # Einzelzeitgrenzen bleiben unveraendert, kein uebersprungener Nachweis.
    # CI37442488028: Datenbank/Setup ~7min und erfolgreiche Standard-Suite9min;
    # Bereichsregression am20-Minuten-Limit abgebrochen. Alle Pflichtschritte
    # und Einzelgrenzen bleiben gleich, Gesamtfenster endlich30min.
    # CI38183359329: Standard169/169 ~14min plus DB/Setup und Bereichsregression;
    # der neue echte EU-Migrationsnachweis und Z22 behalten eigene Pflichtschritte.
    # Endliches Gesamtfenster35min, keine Suite oder Einzelgrenze entfaellt.
    timeout-minutes: 35
    # KURZLEBIGE CI-TESTDATENBANK (Korrektur 2026-08-28, Befund „falsches Grün").
    # ---------------------------------------------------------------------------
    # Für die Datenbanknachweise zu Z22 und Kontoschreibschutz. Der Dienst lebt so lange wie
    # dieser Job, enthält ausschließlich synthetische Zeilen und hat mit Production
    # nichts zu tun: kein Supabase, kein Secret, keine echte Mandatskennung.
    # Hauptversion 17 wie Production (17.6) — die Prüfung liest u. a. Zugriffswege.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: helmut
          POSTGRES_PASSWORD: helmut
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U helmut"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Volle Historie: der Bereichs-Regressionsschritt vergleicht den PR-Kopf mit dem
          # Basis-Commit (github.event.pull_request.base.sha). Ohne fetch-depth: 0 fehlt der
          # Basis-Commit im flachen Checkout.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # W15's closed worker validates this exact native runtime.
          node-version: 24.19.0
          cache: npm
      - name: W15 gezielte Speicherzuordnung — nur 32 MiB synthetische Datei und Kopie
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/w15-full-restore-result-20261030'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          node scripts/lokal.js -- python3 -B scripts/w15-github/test_restore_memory_probe.py --unit-only
          sudo -n env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 \
            GITHUB_ACTIONS=true GITHUB_EVENT_NAME=pull_request W15_MEMORY_PROBE_HEAD_REF=codex/w15-full-restore-result-20261030 \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_SHA="$GITHUB_SHA" \
            /usr/bin/python3 -I -B scripts/w15-github/test_restore_memory_probe.py --probe-synthetic-copy-only \
              --run-id "$GITHUB_RUN_ID" --expected-commit "$GITHUB_SHA"
      - name: W15 echter synthetischer Minimalanschluss — einmalige Diagnose
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/w15-native-restore-minimal-20261030'
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          docker pull postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
          sudo -n env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 \
            GITHUB_ACTIONS=true GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_SHA="$GITHUB_SHA" \
            /usr/bin/python3 -I -B scripts/w15-github/test_restore_native_minimal.py --native-minimal "$(command -v node)"
      - name: Prüfplan aus geänderten Dateien
        id: plan
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            CHANGED="$(git diff --name-only "$BASE" "${{ github.sha }}")"
          else
            CHANGED=""
          fi
          printf 'Geänderte Dateien:\n%s\n' "$CHANGED"
          node scripts/ci-pruefplan.js --files "$CHANGED" --github-output "$GITHUB_OUTPUT"
      - name: Abhängigkeiten installieren (aus package-lock.json)
        if: steps.plan.outputs.npm == 'true'
        # Seit Sprint „Kalender Machbarkeit 1" hat das Repo GENAU EINE
        # Laufzeitabhängigkeit: ical.js (MPL-2.0, RFC-5545-Parser, selbst ohne
        # Transitivabhängigkeiten). Davor war das Repo installationsfrei.
        # `npm ci` statt `npm install`: installiert ausschließlich das, was im
        # Lockfile steht, und schlägt fehl, wenn package.json und Lockfile
        # auseinanderlaufen — sonst könnte ein Lauf still eine andere Version
        # ziehen als der Lockfile-Stand, den wir geprüft haben.
        run: npm ci
      - name: Syntax-Check aller JS-Dateien
        if: steps.plan.outputs.syntax == 'true'
        run: |
          set -e
          for f in server.js client.js sw.js api/index.js lambda/*.js lib/helmut/*.js lib/helmut/kalender/*.js lib/helmut/quellenarchitektur/*.js lib/helmut/quellenarchitektur/seeds/*.js scripts/*.js; do
            node --check "$f"
          done
          echo "Syntax OK"
      - name: SOURCE23 geschlossener Tuple-Codec (synthetisch/offline)
        if: steps.plan.outputs.standard == 'true'
        # Ziel ist genau die Testdatei des neuen geschlossenen Codec
        # scripts/source23_closed_tuple_codec.py. Reiner stdlib-unittest und
        # vollstaendig synthetisch: kein DB-, API-, Netz- oder Secretzugriff,
        # keine Production-Wirkung. python3 ist auf ubuntu-latest vorhanden.
        run: python3 -B scripts/source23_closed_tuple_codec_test.py
      - name: FinalContext Subject-Tupel-Codec (synthetisch/offline)
        if: steps.plan.outputs.standard == 'true'
        run: python3 -B scripts/final_context_subject_tuple_codec_test.py
      - name: W15 neue Parent- und Datenzugangsschutzgrenzen (synthetisch)
        if: steps.plan.outputs.standard == 'true'
        run: |
          python3 -B scripts/w15-github/test_runner_parent.py
          python3 -B scripts/w15-github/test_github_data_access.py
          python3 -B scripts/w15-github/test_verify_receiver_key.py
          python3 -B scripts/w15-github/test_build_receiver_browser.py
          node scripts/w15-github/test_receiver_browser.js
          python3 -B scripts/w15-github/test_receive_existing_inputs.py
          python3 -B scripts/w15-github/test_runtime_materialization.py
          python3 -B scripts/w15-github/test_encrypted_index.py
          python3 -B scripts/w15-github/test_receive_runtime_handoff.py
          python3 -B scripts/w15-github/test_runtime_cache.py
          python3 -B scripts/w15-github/test_runtime_restore.py
          python3 -B scripts/w15-github/test_restore_backup_seam.py
          python3 -B scripts/w15-github/test_runtime_owned_backup.py
          python3 -B scripts/w15-github/test_restore_connection.py
          python3 -B scripts/w15-github/test_runtime_qualification.py
          python3 -B scripts/w15-github/test_runner_start.py
          python3 -B scripts/w15-github/test_runner_diagnostics.py
          node scripts/lokal.js -- python3 -B scripts/w15-github/test_post_failure_memory_stat.py
          node scripts/lokal.js -- node scripts/w15-github/test_post_failure_memory_stat.js
          python3 -B scripts/w15-github/test_restore_workflow.py
          node scripts/lokal.js -- python3 -B scripts/w15-github/test_restore_export_diagnostic.py
          node scripts/lokal.js -- python3 -B scripts/w15-github/test_restore_export_phase.py
          node scripts/lokal.js -- python3 -B scripts/w15-github/test_restore_action_phase.py
          node scripts/lokal.js -- python3 -B scripts/w15-github/test_restore_diagnostic_dispatch.py
          node scripts/lokal.js -- node scripts/w15-github/test_restore_diagnostic_dispatch.js
          node scripts/lokal.js -- python3 -B scripts/w15-github/test_full_restore_capture_phase.py
          node scripts/lokal.js -- python3 -B scripts/w15-github/test_full_restore_dispatch.py
          node scripts/lokal.js -- node scripts/w15-github/test_full_restore_dispatch.js
          node scripts/lokal.js -- python3 -B scripts/w15-github/test_end500_tcp_readiness.py
          node scripts/lokal.js -- python3 -B scripts/w15-github/test_end500_dispatch.py
          node scripts/lokal.js -- node scripts/w15-github/test_end500_dispatch.js
          python3 -B scripts/w15-github/test_restore_resources.py
          python3 -B scripts/w15-github/test_restore_backup.py
          python3 -B scripts/w15-github/test_artifact_transport.py
          python3 -B scripts/w15-github/test_gated_index.py
          python3 -B scripts/w15-github/test_full_container_closure.py
          python3 -B scripts/w15-github/test_receiver_socket_path.py
          python3 -B scripts/w15-github/test_restore_failure_phase.py
          python3 -B scripts/w15-github/test_restore_tcp_readiness.py
          python3 -B scripts/w15-github/test_backup_checkpoints.py
          python3 -B scripts/w15-github/test_backup_failure_projection.py
          python3 -B scripts/w15-github/test_mock500_parent.py
          python3 -B scripts/w15-github/test_mock500_runner.py
          python3 -B scripts/w15-github/test_mock500_inputs.py
          node scripts/w15-github/test_mock500_bindings.js
          python3 -B scripts/w15-github/test_mock500_resources.py
          python3 -B scripts/w15-github/test_mock500_start.py
          python3 -B scripts/w15-github/test_mock500_backup.py
          node scripts/lokal.js -- node scripts/synthetik-500-w15-provider-time-boundary-test.js
          python3 -B scripts/w15-github/test_mock500_existing_inventory.py
          python3 -B scripts/w15-github/test_mock500_receive.py
          node scripts/lokal.js -- python3 -B scripts/w15-github/test_mock500_original_archive.py
          node scripts/lokal.js -- python3 -B scripts/w15-github/test_mock500_archive_receive.py
          node scripts/lokal.js -- python3 -B scripts/w15-github/test_mock500_archive_handoff_lifecycle.py
          node scripts/lokal.js -- python3 -B scripts/w15-github/test_mock500_receive_dispatch.py
          node scripts/lokal.js -- node scripts/w15-github/test_mock500_receive_dispatch_exec.js
          python3 -B scripts/w15-github/test_mock500_workflow.py
          python3 -B scripts/w15-github/test_mock500_context.py
          python3 -B scripts/w15-github/test_mock500_shared_scopes.py
          node --check .github/actions/w15-mock500/index.js
          node --check .github/actions/w15-isolated/index.js
      - name: Native automation boundary qualification (synthetic)
        # The root deployment bootstrap verifies this actual successful job step,
        # not only the job name. Pure synthetic tests: no SSH, GPG key creation,
        # external APIs, originals, native resource cases or Production access.
        run: node scripts/lokal.js -- python3 -I -S -B scripts/hetzner-native-automation-tests.py
      - name: psql bereitstellen (Voraussetzung des Datenbanknachweises)
        if: steps.plan.outputs.database == 'true'
        # Das ubuntu-latest-Image bringt psql heute mit — aber GitHub darf den Umfang
        # jederzeit ändern, und seit der Nachweis fail-closed ist, würde ein fehlendes
        # Binary JEDEN Merge blockieren, ohne dass jemand Code angefasst hat. Die
        # Voraussetzung wird deshalb ausgesprochen statt vorausgesetzt. Ist psql schon da,
        # kostet der Schritt nichts.
        run: |
          if command -v psql >/dev/null 2>&1; then
            echo "psql vorhanden: $(psql --version)"
          else
            echo "psql fehlt — installiere postgresql-client"
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
            psql --version
          fi

      - name: W15 Snapshot-SQL nativ mit kleinen synthetischen Daten pruefen
        if: steps.plan.outputs.database == 'true'
        timeout-minutes: 3
        env:
          PGHOST: "127.0.0.1"
          PGPORT: "5433"
          PGUSER: "helmut"
          PGPASSWORD: "helmut"
        run: python3 -B scripts/w15-github/test_backup_snapshot_postgres.py --postgres-fixture

      - name: W15 native Exportverbindung mit kleinen synthetischen Daten pruefen
        if: steps.plan.outputs.database == 'true'
        timeout-minutes: 3
        env:
          PGHOST: "127.0.0.1"
          PGPORT: "5433"
          PGUSER: "helmut"
          PGPASSWORD: "helmut"
          W15_BACKUP_EXPORT_FIXTURE_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 -B scripts/w15-github/test_backup_export_native.py --postgres-fixture

      - name: Neue Backupinventare nativ mit drei fiktiven Profilen pruefen
        if: steps.plan.outputs.database == 'true'
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5433'
          PGUSER: helmut
          PGPASSWORD: helmut
        run: python3 -B scripts/w15-github/test_backup_inventory_sql.py --ci-postgres-only

      - name: PostgREST 12.2.3 bereitstellen (Voraussetzung des §11-Rückfallnachweises)
        if: steps.plan.outputs.database == 'true'
        # §11 des Z22-Datenbanknachweises beweist, dass ein Deployment VOR der Migration
        # die Reihenfolgezusage nicht still abschaltet (PGRST202-Rückfall). Dieser Beweis
        # braucht ein echtes PostgREST. Version und Prüfsumme sind gepinnt, damit weder
        # ein neues Release noch ein manipulierter Download das Merge-Gate unbemerkt
        # verändern kann (gleiche Begründung wie der Playwright-Pin unten). Der Download
        # wird bis zu dreimal versucht; ein dauerhaft unerreichbares GitHub-Release ist
        # ein sichtbarer FEHLSCHLAG, kein stiller Skip.
        run: |
          set -e
          for i in 1 2 3; do
            curl -sSL --fail -o /tmp/postgrest.tar.xz \
              https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz \
              && break
            echo "Download-Versuch $i fehlgeschlagen"; sleep 5
            [ "$i" = "3" ] && exit 1
          done
          echo "9f71269e61ac3a940281e93ff415760f5957e430e475ba4c3889f3ede7d5527c  /tmp/postgrest.tar.xz" | sha256sum -c -
          tar -xJf /tmp/postgrest.tar.xz -C /tmp
          /tmp/postgrest --version

      # Der echte Registrierungsnachweis kommt vor den laengeren Suiten, damit
      # Fehler im neuen Datenbankpfad sofort sichtbar sind. Alle bisherigen
      # Pflichtschritte bleiben im selben blockierenden Job erhalten.
      - name: Kontoschreibschutz und 500 Registrierungen gegen PostgreSQL und PostgREST
        if: steps.plan.outputs.database == 'true'
        # Einschliesslich 475 echter inaktiver Anlagen und 475 Aktivierungen.
        timeout-minutes: 5
        env:
          HELMUT_TEST_PG_HOST: "127.0.0.1"
          HELMUT_TEST_PG_PORT: "5433"
          HELMUT_TEST_PG_USER: "helmut"
          HELMUT_TEST_POSTGREST_BIN: "/tmp/postgrest"
          PGPASSWORD: "helmut"
        run: node scripts/lokal.js scripts/auth-store-cas-datenbank-test.js

      - name: Lage-Quellenvertrag gegen isolierte PostgreSQL und PostgREST
        if: steps.plan.outputs.database == 'true'
        timeout-minutes: 2
        env:
          HELMUT_TEST_PG_HOST: "127.0.0.1"
          HELMUT_TEST_PG_PORT: "5433"
          HELMUT_TEST_PG_USER: "helmut"
          HELMUT_TEST_POSTGREST_BIN: "/tmp/postgrest"
          PGPASSWORD: "helmut"
        run: node scripts/lokal.js -- node scripts/lage-quellen-rest-datenbank-test.js

      - name: Null auf 500 auf Null gegen echte isolierte PostgreSQL
        if: steps.plan.outputs.database == 'true'
        timeout-minutes: 2
        env:
          HELMUT_TEST_PG_HOST: "127.0.0.1"
          HELMUT_TEST_PG_PORT: "5433"
          HELMUT_TEST_PG_USER: "helmut"
          PGPASSWORD: "helmut"
        run: node scripts/lokal.js -- node scripts/testfenster-null500-datenbank.js

      - name: Vierer-Nacharbeit gegen isolierte PostgreSQL (Atomarik und kein Retry)
        if: steps.plan.outputs.database == 'true'
        timeout-minutes: 3
        env:
          HELMUT_TEST_PG_HOST: "127.0.0.1"
          HELMUT_TEST_PG_PORT: "5433"
          HELMUT_TEST_PG_USER: "helmut"
          PGPASSWORD: "helmut"
        run: node scripts/lokal.js -- node scripts/verstehen-vier-datenbank.js

      - name: Realkohorten-Endweg gegen echte isolierte PostgreSQL
        if: steps.plan.outputs.database == 'true'
        # Neuer inaktiver Vertrag; synthetischer Tabellenbestand in eigener
        # kurzlebiger Testdatenbank. Keine Production-Verbindung oder Freigabe.
        timeout-minutes: 2
        env:
          HELMUT_REAL500_PG_ISOLIERT: "JA"
          HELMUT_TEST_PG_HOST: "127.0.0.1"
          HELMUT_TEST_PG_PORT: "5433"
          HELMUT_TEST_PG_USER: "helmut"
          PGPASSWORD: "helmut"
        run: node scripts/lokal.js -- node scripts/realkohorte-500-endweg-datenbank-test.js

      - name: Realkohorten-Runtime gegen echte isolierte PostgreSQL17
        if: steps.plan.outputs.database == 'true'
        # Default-off RPC, private Quittung, Teilaktivierung und Triggerrollback.
        # Eigene kurzlebige Datenbank; fehlender DB-Beleg ist ein Fehler.
        timeout-minutes: 3
        env:
          HELMUT_REAL500_PG_ISOLIERT: "JA"
          HELMUT_TEST_PG_HOST: "127.0.0.1"
          HELMUT_TEST_PG_PORT: "5433"
          HELMUT_TEST_PG_USER: "helmut"
          PGPASSWORD: "helmut"
        run: node scripts/lokal.js -- node scripts/realkohorte-500-runtime-datenbank-test.js

      - name: Synthetik500 Import gegen echte isolierte PostgreSQL17
        if: steps.plan.outputs.database == 'true'
        # Vollstaendiger Profilersatz/Rueckweg; Standardlauf alleine fuehrt kein SQL aus.
        timeout-minutes: 3
        env:
          HELMUT_SYNTHETIK500_PG_ISOLIERT: "JA"
          HELMUT_TEST_PG_HOST: "127.0.0.1"
          HELMUT_TEST_PG_PORT: "5433"
          HELMUT_TEST_PG_USER: "helmut"
          PGPASSWORD: "helmut"
        run: node scripts/lokal.js scripts/synthetik-500-import-test.js --postgres-local

      - name: Synthetik500 Import bis Abschaltung gegen echte isolierte PostgreSQL17
        if: steps.plan.outputs.database == 'true'
        # Echtes erzeugtes Importjournal, atomarer 500er Start, Teilende und RPC-Rechte.
        timeout-minutes: 3
        env:
          HELMUT_SYNTHETIK500_PG_ISOLIERT: "JA"
          HELMUT_TEST_PG_HOST: "127.0.0.1"
          HELMUT_TEST_PG_PORT: "5433"
          HELMUT_TEST_PG_USER: "helmut"
          PGPASSWORD: "helmut"
        run: node scripts/lokal.js scripts/synthetik-500-runtime-datenbank-test.js

      - name: Synthetik500 nativer Vollbackup und Rueckweg gegen isolierte PostgreSQL17
        if: steps.plan.outputs.database == 'true'
        # Kleine SQL-Requests, typgetreue Sicherung und vollstaendiger Feld-CAS.
        timeout-minutes: 3
        env:
          HELMUT_SYNTHETIK500_PG_ISOLIERT: "JA"
          HELMUT_TEST_PG_HOST: "127.0.0.1"
          HELMUT_TEST_PG_PORT: "5433"
          HELMUT_TEST_PG_USER: "helmut"
          PGPASSWORD: "helmut"
        run: node scripts/lokal.js scripts/synthetik-500-native-import-test.js --postgres-local

      - name: Neue inerte Native-D-Ablage gegen echte isolierte PostgreSQL17
        if: steps.plan.outputs.database == 'true'
        timeout-minutes: 3
        env:
          HELMUT_SYNTHETIK500_PG_ISOLIERT: "JA"
        run: |
          set -euo pipefail
          IMAGE="postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3"
          export HELMUT_SYNTHETIK500_PG_CONTAINER="synthetik500-runtime-pg-$(openssl rand -hex 8)"
          docker pull "$IMAGE"
          docker tag "$IMAGE" postgres:17.6-bookworm
          docker run -d --network none --name "$HELMUT_SYNTHETIK500_PG_CONTAINER" -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17.6-bookworm
          trap 'docker rm -fv "$HELMUT_SYNTHETIK500_PG_CONTAINER" >/dev/null' EXIT
          # Die offizielle Docker-Initialisierung oeffnet kurzzeitig einen NUR
          # am Unix-Socket erreichbaren Server und stoppt ihn wieder, bevor der
          # echte Daemon startet. Das Default-pg_isready im Container prueft nur
          # den Unix-Socket und meldete diesen Zwischenstand faelschlich als
          # bereit (CI: erster SQL-Socket danach nicht vorhanden). Deshalb wird
          # ausschliesslich der TCP-Loopback des realen Enddienstes geprueft.
          for attempt in {1..30}; do
            if docker exec "$HELMUT_SYNTHETIK500_PG_CONTAINER" pg_isready -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          # Kein stiller Durchfall nach der Grenze: die TCP-Bereitschaft muss
          # hier positiv bestaetigt sein, sonst scheitert der Schritt.
          docker exec "$HELMUT_SYNTHETIK500_PG_CONTAINER" pg_isready -h 127.0.0.1 -U postgres
          node scripts/lokal.js -- node scripts/synthetik-500-native-d-new-datenbank-test.js

      - name: Unabhaengige Endsteuerung gegen echten PostgreSQL17 und pg_cron
        if: steps.plan.outputs.database == 'true'
        timeout-minutes: 5
        env:
          HELMUT_END500_PG_ISOLIERT: "JA"
        run: |
          set -euo pipefail
          docker build -f scripts/fixtures/end500-pg17.Dockerfile -t helmut-end500-pg17:1 scripts/fixtures
          export HELMUT_END500_PG_CONTAINER="end500-pg-$(openssl rand -hex 8)"
          docker run -d --network none --name "$HELMUT_END500_PG_CONTAINER" -e POSTGRES_HOST_AUTH_METHOD=trust helmut-end500-pg17:1 -c shared_preload_libraries=pg_cron -c cron.database_name=postgres -c cron.use_background_workers=on
          trap 'docker rm -fv "$HELMUT_END500_PG_CONTAINER" >/dev/null' EXIT
          # Gleiche Ursache wie im Native-D-Schritt: der transiente
          # Unix-Socket-Zwischenstand der Init ist keine echte Bereitschaft.
          # Geprueft wird nur der TCP-Loopback des realen Enddienstes.
          for attempt in {1..30}; do
            if docker exec "$HELMUT_END500_PG_CONTAINER" pg_isready -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          # Kein stiller Durchfall nach der Grenze: die TCP-Bereitschaft muss
          # hier positiv bestaetigt sein, sonst scheitert der Schritt.
          docker exec "$HELMUT_END500_PG_CONTAINER" pg_isready -h 127.0.0.1 -U postgres
          node scripts/lokal.js -- node scripts/end500-unabhaengig-datenbank-test.js

      - name: EU-Servicezeitvertrag, Tagesbuch-Bootstrap und Rueckweg gegen isolierten PostgreSQL17
        if: steps.plan.outputs.database == 'true'
        timeout-minutes: 3
        run: |
          set -euo pipefail
          IMAGE="postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3"
          export HELMUT_EU_PG_CONTAINER="blocker3-eu-pg-$(date -u +%Y%m%d)"
          docker pull "$IMAGE"
          docker tag "$IMAGE" postgres:17.6-bookworm
          docker run -d --network none --name "$HELMUT_EU_PG_CONTAINER" -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17.6-bookworm
          trap 'docker rm -fv "$HELMUT_EU_PG_CONTAINER" >/dev/null' EXIT
          for attempt in {1..30}; do
            if docker exec "$HELMUT_EU_PG_CONTAINER" pg_isready -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          docker exec "$HELMUT_EU_PG_CONTAINER" pg_isready -h 127.0.0.1 -U postgres
          # Die gebundenen Vorfunktionen kommen ausschliesslich aus den
          # Repository-Migrationen; keine Production-Daten oder Credentials.
          node scripts/lokal.js -- node scripts/synthetik-500-eu-time-datenbank-test.js
          # Eigene Fixture-DB im selben nachweislich netzlosen Container.
          export HELMUT_EU_DAY_INIT_PG_CONTAINER="$HELMUT_EU_PG_CONTAINER"
          node scripts/lokal.js -- node scripts/synthetik-500-eu-daybook-init-datenbank-test.js
          # Getrennter enger Nachfolger; alter Erstinitializer bleibt unveraendert.
          node scripts/lokal.js -- node scripts/synthetik-500-eu-daybook-rollforward-datenbank-test.js

      - name: Inerte Originalzustands-Reader-SQL gegen isolierten PostgreSQL17.6
        if: steps.plan.outputs.database == 'true'
        timeout-minutes: 2
        run: |
          set -euo pipefail
          IMAGE="postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3"
          export HELMUT_STARTTOR_PG_CONTAINER="starttor-native-pg-$(date -u +%Y%m%d)"
          export HELMUT_STARTTOR_PG_ISOLIERT="JA"
          docker pull "$IMAGE"
          docker tag "$IMAGE" postgres:17.6-bookworm
          docker run -d --network none --name "$HELMUT_STARTTOR_PG_CONTAINER" -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17.6-bookworm
          trap 'docker rm -fv "$HELMUT_STARTTOR_PG_CONTAINER" >/dev/null' EXIT
          for attempt in {1..30}; do
            if docker exec "$HELMUT_STARTTOR_PG_CONTAINER" pg_isready -U postgres; then break; fi
            sleep 1
          done
          docker exec "$HELMUT_STARTTOR_PG_CONTAINER" pg_isready -U postgres
          node scripts/lokal.js -- node scripts/starttor-native-reader-datenbank-test.js

      - name: Schnelle Kernschutzprüfung
        if: steps.plan.outputs.core == 'true'
        env:
          HELMUT_SOURCE_MODE: "off"
        run: node scripts/lokal.js -- node scripts/run-offline-tests.js --fast-core

      - name: Offline-Testsuiten (ohne Netz/DB/LLM/Secrets)
        if: steps.plan.outputs.standard == 'true'
        # Der Runner erzwingt Offline technisch: jede Suite läuft mit einem
        # --require-Netz-Guard (blockt http/https/fetch auf Nicht-Localhost)
        # und NO_NETWORK_TESTS=1. browser-smoke-test.js darf hier mangels
        # Playwright SKIPpen (HELMUT_OFFLINE_TEST=1) — die Browser-Pflicht
        # liegt beim browser-smoke-Job unten (dort fail-closed).
        #
        # HELMUT_SOURCE_MODE=off ist seit dem lokalen Production-Schutz PFLICHT
        # (scripts/lokaler-netzschutz.js, Bedingung 5). Der Schutz bricht fail closed ab,
        # wenn der Quellenmodus nicht eindeutig "off" ist — im CI war er bisher gar nicht
        # gesetzt. Ohne diese Zeile hätte der Schutz das gesamte Merge-Gate mit Exit 3
        # abgebrochen (belegt am 2026-08-08). Die Zeile schwächt nichts ab: sie sagt
        # ausdrücklich, was hier ohnehin gilt — dieser Lauf ist offline.
        env:
          HELMUT_SOURCE_MODE: "off"
        run: node scripts/lokal.js -- node scripts/run-offline-tests.js

      - name: Bereichs-Regression (nur geänderte Fachbereiche)
        if: steps.plan.outputs.area == 'true'
        # Deterministische Bereichsauswahl (scripts/bereichsauswahl.js): laeuft NUR die
        # fachlichen Regressionstests der im PR tatsaechlich geaenderten Bereiche — nie die
        # vollstaendige Extended-Suite. Reine Doku-Aenderungen laufen leer durch. Fail closed:
        # eine relevante, nicht zuordenbare Datei erzwingt die konservative Sammelmenge und
        # wird sichtbar gemeldet. Dieselbe kanonische Zuordnung benutzt auch der Runner.
        env:
          HELMUT_SOURCE_MODE: "off"
        run: |
          set -e
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ]; then
            echo "Kein pull_request-Basis-Commit (Ereignis ohne PR) — Bereichsauswahl uebersprungen."
            exit 0
          fi
          echo "Geaenderte Dateien seit $BASE:"
          CHANGED="$(git diff --name-only "$BASE" "${{ github.sha }}")"
          printf '%s\n' "$CHANGED"
          node scripts/lokal.js -- node scripts/run-offline-tests.js --aendert "$CHANGED" --nur-bereich

      - name: Z22-Datenbanknachweis §1–§11 gegen echte PostgreSQL + echtes PostgREST (fail-closed)
        if: steps.plan.outputs.database == 'true'
        # WARUM EIN EIGENER SCHRITT: Der Nachweis braucht eine echte PostgreSQL. In
        # run-offline-tests.js lief er nur als stiller SKIP mit (Exit 0 = PASS) und
        # täuschte damit eine Abdeckung vor, die niemand erbracht hatte — genau darunter
        # blieb die Abweichung zwischen SQL und Attrappe bei leerer `tenant_id`
        # unentdeckt. Er steht deshalb in der DENYLIST des Runners und läuft hier.
        #
        # HELMUT_REQUIRE_PG=1 macht ihn fail-closed: fehlt der Dienst, ist das ein
        # FEHLSCHLAG, kein Skip. Derselbe Mechanismus wie HELMUT_REQUIRE_BROWSER=1 im
        # browser-smoke-Job. Der Schritt bleibt im Job "Syntax + Offline-Suiten", damit
        # kein neuer Required Check entsteht (CLAUDE.md §6).
        #
        # Der Lauf geht über scripts/lokal.js (CLAUDE.md §6) — hier gibt es zwar keine
        # Production-Kennungen (permissions: contents: read, keine secrets), aber die
        # Regel gilt ausnahmslos, und der Starter erzwingt zusätzlich den Netzschutz.
        # HELMUT_TEST_PG_HOST ist NUR in diesem Schritt gesetzt: job-weit würden sonst
        # ~35 weitere Datenbanksuiten unbeabsichtigt scharf geschaltet.
        #
        # §11 (Rückfall gegen echtes PostgREST) läuft seit 2026-08-29 MIT: das Binary
        # kommt aus dem Schritt oben, HELMUT_REQUIRE_POSTGREST=1 macht auch diesen
        # Abschnitt fail-closed — ein fehlendes oder nicht startendes PostgREST ist ein
        # FEHLSCHLAG, kein Skip. Erstbeleg des vollständigen Laufs (§1–§11, 48 PASS):
        # lokale PostgreSQL 17.6 + PostgREST 12.2.3, Sitzung vom 29.08.2026.
        env:
          HELMUT_SOURCE_MODE: "off"
          HELMUT_REQUIRE_PG: "1"
          HELMUT_REQUIRE_POSTGREST: "1"
          HELMUT_Z3_POSTGREST: "/tmp/postgrest"
          HELMUT_TEST_PG_HOST: "127.0.0.1"
          HELMUT_TEST_PG_PORT: "5433"
          HELMUT_TEST_PG_USER: "helmut"
          PGPASSWORD: "helmut"
        run: node scripts/lokal.js scripts/vorbedingung-mandatsfilter-datenbank-test.js


  browser-smoke:
    if: github.event_name != 'workflow_dispatch' || (inputs.w15_mode != 'end500-plan' && inputs.w15_mode != 'end500-parent-probe' && inputs.w15_mode != 'end500-handoff-canary' && inputs.w15_mode != 'end500-receiver-check' && inputs.w15_mode != 'end500-receive-inputs' && inputs.w15_mode != 'end500-restore-synthetic' && inputs.w15_mode != 'end500-restore-gated' && inputs.w15_mode != 'end500-restore-export-diagnostic' && inputs.w15_mode != 'end500-full-gated' && inputs.w15_mode != 'mock500-runner-synthetic' && inputs.w15_mode != 'mock500-full-gated' && inputs.w15_mode != 'mock500-receive-originals')
    name: Browser-/Mobile-Smoke (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Prüfplan aus geänderten Dateien
        id: plan
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            CHANGED="$(git diff --name-only "$BASE" "${{ github.sha }}")"
          else
            CHANGED=""
          fi
          node scripts/ci-pruefplan.js --files "$CHANGED" --github-output "$GITHUB_OUTPUT"
      - name: Abhängigkeiten installieren (aus package-lock.json)
        if: steps.plan.outputs.browser == 'true'
        run: npm ci
      - name: Playwright + Chromium installieren
        if: steps.plan.outputs.browser == 'true'
        run: |
          # Version gepinnt (Review-Fix): ohne Pin zöge jeder CI-Lauf die neueste
          # Playwright/Chromium-Version — ein Release könnte das Merge-Gate ohne
          # Codeänderung rot/fälschlich grün machen. Bei Playwright-Update hier
          # bewusst anheben.
          npm i --no-save playwright@1.56.1
          # Playwright liefert seinen eigenen gepinnten Chromium. Eine fremde
          # Google-Chrome-APT-Liste lieferte am 09.09. falsche Hashes und
          # blockierte bereits apt update. Nur diese unbenoetigte Liste wird
          # im kurzlebigen Testrechner reversibel aus der APT-Auswahl genommen.
          # Pruefsummen, Ubuntu-Abhaengigkeiten und Browserpflicht bleiben aktiv.
          sudo python3 - <<'PY'
          from pathlib import Path
          import re
          for source in Path('/etc/apt/sources.list.d').iterdir():
              if source.suffix not in ('.list', '.sources'):
                  continue
              lines = [line.strip() for line in source.read_text().splitlines()
                       if line.strip() and not line.lstrip().startswith('#')]
              urls = re.findall(r'https?://[^\s\]]+', '\n'.join(lines))
              if urls and all(re.fullmatch(r'https?://dl\.google\.com/linux/chrome(?:-stable)?/deb/?', url) for url in urls):
                  source.rename(source.with_name(source.name + '.helmut-ci-disabled'))
                  print('Unbenoetigte Chrome Paketliste isoliert:', source.name)
          PY
          npx playwright install --with-deps chromium
      - name: Browser-Smoke (Desktop + Mobil, lokaler In-Process-Server)
        if: steps.plan.outputs.browser == 'true'
        # Fail-closed (Audit-Folgebranch): GitHub setzt CI=true automatisch,
        # womit browser-smoke-test.js bei fehlendem Playwright bereits mit
        # Exit 1 abbricht statt still zu SKIPpen. Das Flag macht die Pflicht
        # zusätzlich explizit und unabhängig vom CI-Env-Verhalten.
        env:
          HELMUT_REQUIRE_BROWSER: "1"
          # Gleicher Grund wie oben: der Quellenmodus wird ausdrücklich als "off" erklärt.
          HELMUT_SOURCE_MODE: "off"
        run: node scripts/lokal.js -- node scripts/browser-smoke-test.js
      - name: Getrennte Prosa in beiden App Ansichten (Chromium, hell und dunkel)
        if: steps.plan.outputs.browser == 'true'
        env:
          HELMUT_REQUIRE_BROWSER: "1"
          HELMUT_SOURCE_MODE: "off"
        run: node scripts/lokal.js -- node scripts/prosa-vorschau-test.js

  w15-end500-plan:
    name: W15 Vorbereitungsplan — kein End500-Test
    if: github.event_name == 'workflow_dispatch' && inputs.w15_mode == 'end500-plan'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exakten freigegebenen Quellenstand lesen
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || [[ "$(git rev-parse HEAD)" != "$EXPECTED_COMMIT" ]]; then
            echo 'W15_PLAN_COMMIT_BINDING_FAILED'
            exit 1
          fi
      - name: Oeffentlichen Plan ohne Datenzugang oder Ressourcenstart erzeugen
        run: python3 -B scripts/w15-github/prepare.py --plan
      - name: Runnerfaehigkeiten rein lesend beobachten — kein Bootstrap oder Teststart
        run: python3 -B scripts/w15-github/runner_preflight.py --observe-runner-only --runner-temp "$RUNNER_TEMP"
      - name: Startgrenze anzeigen
        shell: bash
        run: |
          echo 'Plan erzeugt. End500 und Mock500 wurden nicht gestartet.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Start bleibt BLOCKED: privater Eingang, Ressourcenmessung, CI-Adapter, Ruecksicherung und neues GO fehlen.' >> "$GITHUB_STEP_SUMMARY"

