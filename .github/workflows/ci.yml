name: CI — Offline-Suite + Browser-Smoke

# =============================================================================
# Blockierendes CI-Gate für den KERN (Audit-Fix 2026-07, Sprint 5).
# Vorher führte KEIN Workflow die Offline-Testsuiten bei PR/Push aus — eine
# Regression in server.js/client.js/lib erreichte ungeprüft main und Production.
#
# GRENZEN (hart): KEINE Secrets, KEINE Supabase-Verbindung, KEIN LLM, KEIN
# Deployment. Alle Suiten laufen offline (DB/fetch gemockt bzw. lokaler Server).
#
# DAMIT DAS GATE BLOCKIERT, muss der Betreiber EINMALIG Branch Protection
# aktivieren (GitHub → Settings → Branches → Add branch protection rule):
#   Branch: main
#   [x] Require status checks to pass before merging
#       -> "Syntax + Offline-Suiten" und "Browser-/Mobile-Smoke (Chromium)"
#   [x] Require branches to be up to date before merging
# =============================================================================

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Standard, explizite Kernabnahme ohne alte Mengenlaeufe oder gesonderter Mock100'
        type: choice
        options: [standard, verarbeitungskern, mock100]
        default: standard
      expected_commit:
        description: 'Kernabnahme/Mock100: exakt angefragter 40-stelliger Kandidatencommit'
        type: string
        default: ''
      prerequisite_ci_run_id:
        description: 'Mock100: erfolgreicher Pflicht-CI-Lauf auf diesem Kandidatencommit'
        type: string
        default: ''
      mock100_nonce:
        description: 'Mock100: frische UUIDv4; keine Wiederholung eines Laufes'
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}${{ inputs.mode == 'mock100' && '-mock100' || '' }}
  cancel-in-progress: ${{ inputs.mode != 'mock100' }}

jobs:
  offline-suite:
    if: inputs.mode != 'mock100'
    name: Syntax + Offline-Suiten
    runs-on: ubuntu-latest
    # CI35207010979: 397/397 Suiten erfolgreich in779s, aber inklusive Setup
    # und Kontoschutz am15-Minuten-Jobende abgebrochen; Z22 wurde uebersprungen.
    # Endliches Gesamtfenster fuer ALLE Pflichtschritte; Suiten und ihre
    # Einzelzeitgrenzen bleiben unveraendert, kein uebersprungener Nachweis.
    # CI37442488028: Datenbank/Setup ~7min und erfolgreiche Standard-Suite9min;
    # Bereichsregression am20-Minuten-Limit abgebrochen. Alle Pflichtschritte
    # und Einzelgrenzen bleiben gleich, Gesamtfenster endlich30min.
    # CI38183359329: Standard169/169 ~14min plus DB/Setup und Bereichsregression;
    # der neue echte EU-Migrationsnachweis und Z22 behalten eigene Pflichtschritte.
    # Endliches Gesamtfenster35min, keine Suite oder Einzelgrenze entfaellt.
    # Existing mandatory suites retain their limits; reserve ten minutes for the
    # pinned tool build and separately bounded native three-profile preflight.
    timeout-minutes: 45
    # KURZLEBIGE CI-TESTDATENBANK (Korrektur 2026-08-28, Befund „falsches Grün").
    # ---------------------------------------------------------------------------
    # Für die Datenbanknachweise zu Z22 und Kontoschreibschutz. Der Dienst lebt so lange wie
    # dieser Job, enthält ausschließlich synthetische Zeilen und hat mit Production
    # nichts zu tun: kein Supabase, kein Secret, keine echte Mandatskennung.
    # Hauptversion 17 wie Production (17.6) — die Prüfung liest u. a. Zugriffswege.
    services:
      postgres:
        image: ${{ inputs.mode != 'verarbeitungskern' && !(github.event_name == 'pull_request' && github.repository == 'ernisch/helmut-pilot' && github.event.number == 1184 && github.event.pull_request.base.sha == '597d7876d3f1ce963174fe749ffb28bd98f15065' && github.event.pull_request.head.ref == 'codex/einprofil-lieferfaehigkeit-20261113') && !(github.event_name == 'pull_request' && github.repository == 'ernisch/helmut-pilot' && github.event.number == 1185 && github.event.pull_request.base.sha == '73b34b02c7690656191a5d45d5efd32c954ff771' && github.event.pull_request.head.ref == 'codex/dip-einzelartikel-20261113') && !(github.event_name == 'pull_request' && github.repository == 'ernisch/helmut-pilot' && github.event.number == 1186 && github.event.pull_request.base.sha == 'cc283e0bae8ed7b9f25c551379a9ee1f8895a91c' && github.event.pull_request.head.ref == 'codex/mandatsarbeit-vorrang-20261113') && !(github.event_name == 'pull_request' && github.repository == 'ernisch/helmut-pilot' && github.event.number == 1187 && github.event.pull_request.base.sha == '32311c78fb17843631f6851ec7103b5f9759ff68' && github.event.pull_request.head.ref == 'codex/gepruefte-lage-teilstaende-20261114') && !(github.event_name == 'pull_request' && github.repository == 'ernisch/helmut-pilot' && github.event.number == 1188 && github.event.pull_request.base.sha == 'c97fbbd0e9a894e4072252be3863bffa29c625e8' && github.event.pull_request.head.ref == 'codex/tagesfrische-und-radarklarheit-20261114') && !(github.event_name == 'pull_request' && github.repository == 'ernisch/helmut-pilot' && github.event.number == 1189 && github.event.pull_request.base.sha == '5a734cc38549c0e6f922bf7471d44042ed3b5deb' && github.event.pull_request.head.ref == 'codex/quellenabruf-arbeitsanteil-20261114') && !(github.event_name == 'pull_request' && github.repository == 'ernisch/helmut-pilot' && github.event.number == 1190 && github.event.pull_request.base.sha == '441ed0af2bf4bd1a5dbd137d8eb7ac4c3d87b616' && github.event.pull_request.head.ref == 'codex/artikel-versionskonflikte-20261114') && !(github.event_name == 'pull_request' && github.repository == 'ernisch/helmut-pilot' && github.event.number == 1191 && github.event.pull_request.base.sha == '0339f19e6167d9f0f9eff67b7acfb0e997af1180' && github.event.pull_request.head.ref == 'codex/lage-ergaenzung-20261114') && !(github.event_name == 'pull_request' && github.repository == 'ernisch/helmut-pilot' && github.event.number == 1192 && github.event.pull_request.base.sha == '21816be73c5a7a759b35e907b9030a37d5c9b294' && github.event.pull_request.head.ref == 'codex/lage-kostenvertrag-20261114') && !(github.event_name == 'pull_request' && github.repository == 'ernisch/helmut-pilot' && github.event.number == 1193 && github.event.pull_request.base.sha == '097d14e29be63e0c19d7c8fedae9e7eb16195c57' && github.event.pull_request.head.ref == 'codex/kundenansichten-20261114') && !(github.event_name == 'pull_request' && github.repository == 'ernisch/helmut-pilot' && github.event.number == 1194 && github.event.pull_request.base.sha == '4a49cbefa84950128116599dd667b181f79909be' && github.event.pull_request.head.ref == 'codex/briefing-fenster-20261114') && !(github.event_name == 'pull_request' && github.repository == 'ernisch/helmut-pilot' && github.event.number == 1195 && github.event.pull_request.base.sha == 'e148640fb195b9a713f613e868965e5990ee9c9a' && github.event.pull_request.head.ref == 'codex/briefing-bestand-erhalten-20261114') && !(github.event_name == 'pull_request' && github.repository == 'ernisch/helmut-pilot' && github.event.number == 1196 && github.event.pull_request.base.sha == '87505694ae9318d660f2052e634613d720729c03' && github.event.pull_request.head.ref == 'codex/radar-artikelanzeige-20261114') && !(github.event_name == 'pull_request' && github.repository == 'ernisch/helmut-pilot' && github.event.number == 1197 && github.event.pull_request.base.sha == '58e21bf57efa3441c4ab0ea822896b02e7180d4b' && github.event.pull_request.head.ref == 'codex/briefing-tagesprioritaet-20261114') && !(github.event_name == 'pull_request' && github.repository == 'ernisch/helmut-pilot' && github.event.number == 1198 && github.event.pull_request.base.sha == '529d47f8a73ceb4179b8ceb6d4ff758a4856468b' && github.event.pull_request.head.ref == 'codex/autonome-artikelversorgung-20261114') && !(github.event_name == 'pull_request' && github.repository == 'ernisch/helmut-pilot' && github.event.number == 1199 && github.event.pull_request.base.sha == '4d70c990b12b1c7dc7872a9d53ee5c16aba819f0' && github.event.pull_request.head.ref == 'codex/artikel-wiedergewinnung-20261114') && !(github.event_name == 'pull_request' && github.repository == 'ernisch/helmut-pilot' && github.event.number == 1200 && github.event.pull_request.base.sha == 'a70efd1c8521770d1c119a65db620814ea08283e' && github.event.pull_request.head.ref == 'codex/briefing-echtlauf-20261114') && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: helmut
          POSTGRES_PASSWORD: helmut
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U helmut"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Volle Historie: der Bereichs-Regressionsschritt vergleicht den PR-Kopf mit dem
          # Basis-Commit (github.event.pull_request.base.sha). Ohne fetch-depth: 0 fehlt der
          # Basis-Commit im flachen Checkout.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: ${{ inputs.mode != 'verarbeitungskern' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prüfplan aus geänderten Dateien
        id: plan
