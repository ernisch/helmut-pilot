name: CI — Offline-Suite + Browser-Smoke

# =============================================================================
# Blockierendes CI-Gate für den KERN (Audit-Fix 2026-07, Sprint 5).
# Vorher führte KEIN Workflow die Offline-Testsuiten bei PR/Push aus — eine
# Regression in server.js/client.js/lib erreichte ungeprüft main und Production.
#
# GRENZEN (hart): KEINE Secrets, KEINE Supabase-Verbindung, KEIN LLM, KEIN
# Deployment. Alle Suiten laufen offline (DB/fetch gemockt bzw. lokaler Server).
#
# DAMIT DAS GATE BLOCKIERT, muss der Betreiber EINMALIG Branch Protection
# aktivieren (GitHub → Settings → Branches → Add branch protection rule):
#   Branch: main
#   [x] Require status checks to pass before merging
#       -> "Syntax + Offline-Suiten" und "Browser-/Mobile-Smoke (Chromium)"
#   [x] Require branches to be up to date before merging
# =============================================================================

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-suite:
    name: Syntax + Offline-Suiten
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-Check aller JS-Dateien
        run: |
          set -e
          for f in server.js client.js sw.js api/index.js lib/helmut/*.js lib/helmut/quellenarchitektur/*.js lib/helmut/quellenarchitektur/seeds/*.js scripts/*.js; do
            node --check "$f"
          done
          echo "Syntax OK"
      - name: Offline-Testsuiten (ohne Netz/DB/LLM/Secrets)
        # Der Runner erzwingt Offline technisch: jede Suite läuft mit einem
        # --require-Netz-Guard (blockt http/https/fetch auf Nicht-Localhost)
        # und NO_NETWORK_TESTS=1. browser-smoke-test.js darf hier mangels
        # Playwright SKIPpen (HELMUT_OFFLINE_TEST=1) — die Browser-Pflicht
        # liegt beim browser-smoke-Job unten (dort fail-closed).
        run: node scripts/run-offline-tests.js

  browser-smoke:
    name: Browser-/Mobile-Smoke (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright + Chromium installieren
        run: |
          # Version gepinnt (Review-Fix): ohne Pin zöge jeder CI-Lauf die neueste
          # Playwright/Chromium-Version — ein Release könnte das Merge-Gate ohne
          # Codeänderung rot/fälschlich grün machen. Bei Playwright-Update hier
          # bewusst anheben.
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser-Smoke (Desktop + Mobil, lokaler In-Process-Server)
        # Fail-closed (Audit-Folgebranch): GitHub setzt CI=true automatisch,
        # womit browser-smoke-test.js bei fehlendem Playwright bereits mit
        # Exit 1 abbricht statt still zu SKIPpen. Das Flag macht die Pflicht
        # zusätzlich explizit und unabhängig vom CI-Env-Verhalten.
        env:
          HELMUT_REQUIRE_BROWSER: "1"
        run: node scripts/browser-smoke-test.js
      - name: Onboarding-Browser-Test (Erstkonfiguration: Scroll/Layout/reduced-motion)
        # Prüft die vom Auftrag geforderten Layout-/Interaktions-Eigenschaften der
        # Erstkonfiguration, die nur im echten Browser messbar sind (Scroll-
        # Stabilität ohne Voll-Neurender, Header nicht angeschnitten, feste
        # Aktionsleiste ohne Überdeckung, kein Querscrollen, reduced-motion).
        # Gleiche Fail-closed-Regel wie oben.
        env:
          HELMUT_REQUIRE_BROWSER: "1"
        run: node scripts/onboarding-browser-test.js
      - name: Erstlogin-Browser-Test (Einladung → Passwort → Sitzung → Begrüßung)
        # Vollständiger Erstlogin-Ablauf im echten Browser: Passwort setzen,
        # Übergang, Sitzungsprüfung auf demselben Ursprung, location.replace,
        # sofortige persönliche Begrüßung, Augen-Toggles, Token-Schutz,
        # Fehlerpfade, Mandantentrennung. Gleiche Fail-closed-Regel wie oben.
        env:
          HELMUT_REQUIRE_BROWSER: "1"
        run: node scripts/onboarding-erstlogin-browser-test.js
      - name: Admin "Nutzer & Kunden"-Fix (Root-Cause-Beweis + Browser-E2E)
        # P0-Fix: Admin-Login -> Tab "Nutzer & Kunden" -> API erfolgreich/Fehler/
        # Timeout -> Sitzung bleibt gültig. Teil A/B laufen bereits offline mit;
        # dieser Schritt stellt sicher, dass Teil C (echter Chromium-Browser)
        # tatsächlich ausgeführt wird statt mangels Playwright zu SKIPpen.
        env:
          HELMUT_REQUIRE_BROWSER: "1"
        run: node scripts/admin-nutzer-kunden-timeout-fix-test.js
