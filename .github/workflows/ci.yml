          if [ "${HELMUT_CI_PR_NUMBER:-}" = 1250 ] \
            || [ "${HELMUT_CI_PR_HEAD_REF:-${GITHUB_REF#refs/heads/}}" = codex/destatis-altfund-20261117 ] \
