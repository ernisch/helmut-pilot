name: PR1183 — vorhandene Pruefnachweise gebunden uebernehmen

# Nur isolierter Hilfsbranch; keine Tests, kein Merge und kein Deployment.
on:
  workflow_dispatch:
    inputs:
      expected_publisher_commit:
        description: 'Exakter gepruefter 40-stelliger Commit dieses Publishers'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write

concurrency:
  group: evidence-pr1183-4f764317
  cancel-in-progress: false

jobs:
  verified-reuse:
    name: Vorhandene Nachweise verifizieren und als solche uebernehmen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, wie im bestaetigten Ursprungslauf
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, wie im bestaetigten Ursprungslauf
        with:
          node-version: 22
      - name: Gebundene erfolgreiche Nachweise uebernehmen - keine Tests erneut ausfuehren
        env:
          GH_TOKEN: ${{ github.token }}
          HELMUT_EXPECTED_PUBLISHER_COMMIT: ${{ inputs.expected_publisher_commit }}
        run: node scripts/ci-evidence-1183.js
