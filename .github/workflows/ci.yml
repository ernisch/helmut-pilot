              && { [ "$(git log -1 --format=%s)" = 'fix(quellen): gespeicherte JSON-Nutzlast korrekt rücklesen (#1245)' ] \
                || [ "$(git rev-parse HEAD^1)" = 3e174583dc8a8c66a3e129a7df57ce0ac9706f66 ]; }; }; then
