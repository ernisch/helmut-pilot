name: Z3b Supabase Lauf B einmalig

on:
  push:
    branches:
      - codex/z3b-safe-activation-500
    paths:
      - .github/workflows/z3b-supabase-lauf-b.yml

permissions:
  contents: read

concurrency:
  group: z3b-supabase-lauf-b-einmalig
  cancel-in-progress: false

jobs:
  lauf-b:
    if: >-
      github.repository == 'ernisch/helmut-pilot' &&
      github.ref == 'refs/heads/codex/z3b-safe-activation-500'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HELMUT_SOURCE_MODE: "off"
      HELMUT_Z3B_SUPABASE_PROJECT_REF: ffzaxdbatoamsovncrym
      HELMUT_Z3B_SUPABASE_URL: https://ffzaxdbatoamsovncrym.supabase.co
      HELMUT_Z3B_STUFE: "25"
      HELMUT_Z3B_AUFTRAEGE: "25"
      HELMUT_Z3B_PARALLELITAET: "8"
      HELMUT_Z3B_LAUF: z3bb20260827run01
      HELMUT_Z3B_FREIGABE: z3b:ffzaxdbatoamsovncrym:25:z3bb20260827run01

    steps:
      - name: Freigegebenen Branch auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Branch und Anfragenriegel pruefen
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ernisch/helmut-pilot"
          test "$GITHUB_REF" = "refs/heads/codex/z3b-safe-activation-500"
          test "$(node -e "const z=require('./scripts/skalierung-z3b-supabase');process.stdout.write(String(z.berechneAnfragenObergrenze({auftraege:25,parallelitaet:8})))")" = "66"

      - name: Offline Vertrag pruefen
        run: node scripts/z3b-supabase-laeufer-test.js

      - name: Supabase Lauf B ausfuehren
        env:
          HELMUT_Z3B_SUPABASE_SECRET_KEY: ${{ secrets.HELMUT_Z3B_SUPABASE_SECRET_KEY }}
        run: node scripts/skalierung-z3b-supabase.js
