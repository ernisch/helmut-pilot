<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Erweiterung von Bundestag zu Berlin und Brandenburg">
  <defs>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#5b6b7f"/></marker>
    <style>
      .t{fill:#1a2b42;font-size:15px;font-weight:600}
      .s{fill:#5b6b7f;font-size:11.5px}
      .cap{fill:#8a97a8;font-size:10px}
      .lbl{fill:#1a2b42;font-size:12.5px;font-weight:600}
      .n{fill:#ffffff;font-size:12px;font-weight:700}
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="450" fill="#ffffff"/>
  <text x="30" y="34" class="t">Erweiterung Bundestag → Berlin &amp; Brandenburg (nur strukturell vorbereiten)</text>
  <text x="30" y="54" class="s">Der Kern ist mehr-ebenen-fähig. BE/BB ist heute DREIFACH gesperrt und liefert 0 Items. In diesem Thread NICHT aktivieren.</text>

  <!-- Bundestag active -->
  <rect x="30" y="82" width="250" height="120" rx="10" fill="#e8f1ea" stroke="#b6d0bf" stroke-width="1.6"/>
  <text x="155" y="108" class="lbl" text-anchor="middle">Bundestag — AKTIV</text>
  <text x="45" y="132" class="s">✓ 145 Quellen, DIP-API (WP 21)</text>
  <text x="45" y="152" class="s">✓ Klassifikation bund/land/kommune</text>
  <text x="45" y="172" class="s">✓ relationale Quellenschicht live</text>
  <text x="45" y="192" class="s">✓ parliamentTypeOf, Landespaket-Map</text>

  <!-- arrow -->
  <line x1="280" y1="142" x2="360" y2="142" stroke="#5b6b7f" stroke-width="1.8" marker-end="url(#a4)"/>
  <text x="320" y="132" class="cap" text-anchor="middle">Umbaupaket P2</text>

  <!-- BE/BB prepared -->
  <rect x="368" y="82" width="250" height="120" rx="10" fill="#eef1f6" stroke="#b7bfd0" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="493" y="108" class="lbl" text-anchor="middle">Berlin / Brandenburg</text>
  <text x="493" y="126" class="cap" text-anchor="middle">VORBEREITET · prepared · inaktiv</text>
  <text x="383" y="150" class="s">• Seed 20260717 in DB (4 Entitäten,</text>
  <text x="383" y="168" class="s">  18 Wege, Regionalmedien)</text>
  <text x="383" y="188" class="s">• Pakete berlin/brandenburg-basis</text>

  <!-- Dreifach-Sperre -->
  <rect x="660" y="82" width="270" height="120" rx="10" fill="#f7ece9" stroke="#e0bcb4" stroke-width="1.6"/>
  <text x="795" y="106" class="lbl" text-anchor="middle" fill="#b3453a">Dreifach-Sperre</text>
  <circle cx="678" cy="128" r="9" fill="#b3453a"/><text x="678" y="132" class="n" text-anchor="middle">1</text>
  <text x="694" y="132" class="s">Landesmodul-Gate (CODE) → P2-1</text>
  <circle cx="678" cy="154" r="9" fill="#b3453a"/><text x="678" y="158" class="n" text-anchor="middle">2</text>
  <text x="694" y="158" class="s">PARDOK kein Live-Modus (CODE) → P2-2</text>
  <circle cx="678" cy="180" r="9" fill="#cc7a33"/><text x="678" y="184" class="n" text-anchor="middle">3</text>
  <text x="694" y="184" class="s">Status needs_review/prepared (DATEN) → P2-4</text>

  <!-- Data vs Code table -->
  <text x="30" y="242" class="lbl">Was reicht per Konfiguration (DATEN) — was braucht Code:</text>
  <rect x="30" y="254" width="440" height="150" rx="8" fill="#f4f7fa" stroke="#dfe6ee"/>
  <text x="45" y="276" class="s" font-weight="700" fill="#3f7d5a">DATA-Flip (Konfiguration)</text>
  <text x="45" y="296" class="s">Parlamente · Ausschüsse · Ministerien</text>
  <text x="45" y="314" class="s">Fraktionen · Behörden · Wahlkreise</text>
  <text x="45" y="332" class="s">Regionalmedien · Quellenpakete</text>
  <text x="45" y="350" class="s">Mandatsprofile (BE/BB anlegen)</text>
  <text x="45" y="374" class="cap">→ P2-4: reine Daten, Gründer-Freigabe für Prod-Seed</text>
  <text x="45" y="392" class="cap">→ in diesem Thread nur vorbereitet, nicht geschrieben</text>

  <rect x="490" y="254" width="440" height="150" rx="8" fill="#fbf5ea" stroke="#e6d3b0"/>
  <text x="505" y="276" class="s" font-weight="700" fill="#b3453a">CODE-Änderung (freigabepflichtig)</text>
  <text x="505" y="296" class="s">P2-1 Landesmodul-Gate parametrisieren</text>
  <text x="505" y="314" class="s">P2-2 PARDOK-Live-Modus bauen</text>
  <text x="505" y="332" class="s">P2-3 Ebenen-Default entkoppeln (kein Auto-Bund)</text>
  <text x="505" y="350" class="s">P2-5 Landes-Relevanz-/Scoring-Kataloge</text>
  <text x="505" y="368" class="s">P2-6 Landtags-Primärquelle · P2-7 Scoring scharf</text>
  <text x="505" y="392" class="cap">→ „Kein Neubau, aber ein umschriebenes Umbaupaket."</text>

  <text x="30" y="432" class="cap">Statuslegende: grün = aktiv/nachgewiesen · blau gestrichelt = vorbereitet/inaktiv · rot = Code-Blocker · orange = Datenstatus. Prüfdatum 2026-07-16 · Commit 427295c.</text>
</svg>
