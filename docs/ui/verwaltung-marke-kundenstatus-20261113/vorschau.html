:root{color-scheme:dark;font-family:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;font-synthesis:none;-webkit-font-smoothing:antialiased;--bg:#070b16;--sidebar:#050912;--surface:#0c1322;--ink:#eaeef6;--muted:#aeb8c9;--line:rgba(255,255,255,.12);--accent:#7fa8e0;--blue-bg:#111a2c;--bad:#f0a0a0;--bad-bg:#301e29;--ok:#70d7ac;--ok-bg:#102b26;--warn:#ebc477;--warn-bg:#2b271e;background:var(--bg);color:var(--ink)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg)}
button,input,select,textarea{font:inherit}
button,a,input,select,summary{-webkit-tap-highlight-color:transparent}
button,a,summary{touch-action:manipulation}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.55}
a{color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3,.customer strong{overflow-wrap:anywhere}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
h1:focus{outline:none}
[hidden]{display:none!important}
.skip{position:fixed;top:-80px;left:16px;z-index:30;padding:14px;background:#e9edf5;color:#0a0f1c}
.skip:focus{top:12px}
.demo{position:relative;z-index:15;padding:10px 20px;background:var(--blue-bg);color:var(--muted);text-align:center;font-size:12px;line-height:1.5}
.rail{position:fixed;top:0;bottom:0;width:224px;padding:32px 20px 24px;background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column}
[data-banner="true"] .rail{top:38px}
.rail-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mobile-refresh{display:none;align-items:center;justify-content:center;width:44px;min-height:44px;flex:none;border:0;border-radius:10px;background:transparent;color:var(--accent)}
.mobile-refresh svg{width:22px;height:22px;pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px;text-decoration:none}
.brand-logo{width:34px;height:34px;flex:none}
.brand strong{display:block;font:400 26px/1.15 Spectral,Georgia,serif;letter-spacing:-.3px}
.brand small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.nav{display:grid;gap:6px;margin-top:40px}
.nav button{min-height:46px;border:0;border-radius:10px;background:transparent;padding:12px 15px;color:var(--muted);font-size:14px;text-align:left}
.nav button[aria-current=page]{background:var(--blue-bg);color:var(--accent);font-weight:600}
.rail-foot{margin-top:auto;padding:16px 10px 0;border-top:1px solid var(--line)}
.rail-foot>.link{font-size:12px}
main{margin-left:224px;max-width:1280px;padding:44px clamp(24px,5vw,64px) 60px;min-height:100dvh}
.eyebrow{color:var(--muted);font-size:12px;font-weight:500;letter-spacing:.04em}
.head{margin:24px 0 30px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.head>div{min-width:0}
h1{font:400 clamp(32px,3.8vw,44px)/1.17 Spectral,Georgia,serif;letter-spacing:-.6px}
h2{font-size:20px;line-height:1.35;font-weight:600;letter-spacing:-.3px}
h3{font-size:16px;font-weight:600}
.sub{color:var(--muted);font-size:15px;line-height:1.65;margin-top:10px;max-width:65ch;overflow-wrap:anywhere}
.btn{border:1px solid var(--line);background:transparent;min-height:44px;max-width:100%;border-radius:12px;padding:11px 16px;font-size:14px;font-weight:500;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:normal;text-align:center}
.btn.primary{background:#e9edf5;color:#0a0f1c;border-color:#e9edf5}
.btn:hover:not(:disabled){background:#17243a}
.btn.primary:hover:not(:disabled){background:#fff}
.link{border:0;background:none;color:var(--accent);padding:12px 0;min-height:44px;font-size:14px;text-align:left}
.back{color:var(--muted);margin-top:-12px;margin-bottom:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;margin-bottom:22px}
.tag{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:500;line-height:1.4;color:#cad4e5;padding:5px 9px;border-radius:7px;background:#172135}
.tag:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.quiet{font-size:13px;line-height:1.7;color:var(--muted)}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.rows{border-top:1px solid var(--line)}
.customer{width:100%;border:0;background:none;display:grid;grid-template-columns:minmax(0,1fr) auto 12px;align-items:center;text-align:left;gap:16px;padding:20px 0;border-bottom:1px solid var(--line);color:var(--ink);min-height:80px}
.customer:hover{background:var(--blue-bg)}
.customer strong{display:block;font-size:15px;font-weight:550}
.customer small{display:block;color:var(--muted);font-size:12px;line-height:1.5;margin-top:5px;overflow-wrap:anywhere}
.arrow{color:var(--muted)}
.search{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:48px;padding:12px 14px;color:var(--ink);margin:8px 0 16px}
.checks{display:grid}
.check{display:flex;justify-content:space-between;align-items:center;gap:20px;min-height:70px;padding:17px 0;border-bottom:1px solid var(--line)}
.check:last-child{border:0}
.check>div{min-width:0}
.check strong{display:block;font-size:14px;font-weight:550}
.check small{display:block;color:var(--muted);font-size:13px;line-height:1.6;margin-top:5px}
.notice{padding:16px 18px;border-radius:10px;background:var(--blue-bg);color:var(--ink);font-size:14px;line-height:1.7;margin:20px 0;overflow-wrap:anywhere}
.notice .field{margin-top:16px}
.form-panel{max-width:680px}
.form-section{margin:28px 0 20px;padding-top:24px;border-top:1px solid var(--line);font-size:18px}
.field{display:grid;gap:9px;margin-bottom:22px;font-size:14px;font-weight:550}
.field input,.field select,textarea{width:100%;min-height:48px;padding:12px 14px;border:1px solid rgba(255,255,255,.22);border-radius:8px;background:#080f1d;color:var(--ink);font-size:16px;font-weight:400}
.field input:disabled,.field select:disabled{opacity:.6}
.field small{color:var(--muted);font-size:13px;font-weight:400;line-height:1.6}
textarea{min-height:88px;resize:vertical}
.form-foot{display:flex;justify-content:flex-end;gap:15px;border-top:1px solid var(--line);padding-top:24px;margin-top:28px}
details{margin-top:20px;border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;min-height:44px;padding:10px 0;font-size:14px;color:var(--muted)}
details p,details li{font-size:13px;line-height:1.8;color:var(--muted)}
.empty{padding:28px 4px;color:var(--muted);font-size:14px}
.setting-row{display:flex;align-items:center;gap:14px;width:100%;min-height:66px;padding:18px 0;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;text-align:left}
.setting-row>span:first-child{flex:1;min-width:0}
.setting-row strong{display:block;font-size:15px;font-weight:550}
.setting-row small{display:block;margin-top:6px;font-size:13px;color:var(--muted);line-height:1.6}
.setting-row:hover:not(:disabled){color:var(--accent)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.error,.field-error{color:var(--bad);font-size:14px;line-height:1.6;margin:12px 0;overflow-wrap:anywhere}
.setting-link{display:block;padding:18px 0;min-height:44px;border-bottom:1px solid var(--line);text-decoration:none}
.setting-link strong{display:block;font-size:15px}
.attention>.link{margin-top:10px}
.customer-tools>.setting-row:first-child{padding-top:0}
.customer-tools details,.source-main details{margin-top:15px;padding-top:12px}
.supply-overview{margin:0 4px 24px}
