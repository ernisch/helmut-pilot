<head>

<title>Helmut · Einfach verwalten · Entwurf</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0f1729;background:#f4f6fa;font-synthesis:none;--ink:#0f1729;--muted:#5b6473;--line:#e2e6ee;--accent:#3956c4;--blue-bg:#edf1ff;--bad:#b12c3a;--bad-bg:#fff0f1;--ok:#1c704c;--ok-bg:#edf7f1;--warn:#80590b;--warn-bg:#fff6e3}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a,input,select,summary{-webkit-tap-highlight-color:transparent}button,a,summary{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}a{color:inherit}h1,h2,h3,p{margin:0}button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #3956c4;outline-offset:4px}h1:focus{outline:none}h1,h2,h3,.customer strong{overflow-wrap:anywhere}.skip{position:fixed;top:-80px;left:16px;z-index:30;padding:14px;background:white}.skip:focus{top:12px}.demo{position:relative;z-index:15;padding:10px 20px;background:#e9edf6;color:#475269;text-align:center;font-size:12px;line-height:1.5}.rail{position:fixed;top:38px;bottom:0;width:218px;padding:35px 20px 24px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;padding:0 12px}.mark{width:34px;height:38px;border-radius:10px;background:var(--ink);color:white;display:grid;place-items:center;font:28px Georgia,serif}.brand strong{display:block;font-size:21px;letter-spacing:-.7px}.brand small{display:block;font-size:11px;color:var(--muted);margin-top:4px}.nav{display:grid;gap:6px;margin-top:46px}.nav button{display:flex;gap:12px;align-items:center;text-align:left;min-height:46px;border:0;border-radius:10px;background:transparent;padding:12px 15px;color:var(--muted);font-size:14px}.nav button[aria-current=page]{background:var(--blue-bg);color:var(--accent);font-weight:600}.nav svg{height:18px;width:18px;flex:none}.rail-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:20px 12px 0;border-top:1px solid var(--line);line-height:1.7}main{margin-left:218px;max-width:1360px;padding:46px clamp(24px,5vw,72px) 60px;min-height:calc(100vh - 38px)}.eyebrow{color:var(--muted);font-size:12px;font-weight:550;letter-spacing:.04em}.head{margin:24px 0 30px;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:clamp(30px,3.8vw,44px);letter-spacing:-1.6px;line-height:1.12;font-weight:650}h2{font-size:19px;letter-spacing:-.4px;font-weight:620}h3{font-size:15px;font-weight:600}.sub{color:var(--muted);font-size:14px;line-height:1.65;margin-top:10px;max-width:65ch}.btn{border:1px solid var(--line);background:#fff;min-height:44px;border-radius:10px;padding:11px 16px;font-size:13px;font-weight:550;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:normal;text-align:center}.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.link{border:0;background:none;color:var(--accent);padding:12px 0;min-height:44px;font-size:13px;text-align:left}.back{color:var(--muted);margin-top:-12px;margin-bottom:12px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:28px;margin-bottom:22px}.hero{padding:32px}.hero h2{font-size:27px;margin-top:16px;letter-spacing:-.8px}.hero .btn{margin-top:23px}.tag{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:550;line-height:1.4;color:var(--muted);padding:5px 9px;border-radius:7px;background:#f0f2f6}.tag:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.quiet{font-size:12px;line-height:1.7;color:var(--muted)}.summary-line{display:flex;gap:28px;flex-wrap:wrap;padding:0 4px;margin:25px 0 34px;font-size:13px;color:var(--muted)}.summary-line strong{font-size:20px;font-weight:600;color:var(--ink);margin-right:7px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:17px}.rows{border-top:1px solid var(--line)}.customer{width:100%;border:0;background:none;display:grid;grid-template-columns:minmax(160px,1fr) minmax(120px,1fr) auto 14px;align-items:center;text-align:left;gap:18px;padding:21px 3px;border-bottom:1px solid var(--line);color:var(--ink);min-height:78px}.customer:hover{background:#f9fafc}.customer strong{display:block;font-size:14px;font-weight:570}.customer small{display:block;color:var(--muted);font-size:12px;margin-top:6px}.customer .note{font-size:12px;color:var(--muted)}.arrow{color:#8a94a4}.search{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;min-height:46px;padding:12px 15px;color:var(--ink);margin:0 0 15px}.checks{display:grid}.check{display:flex;justify-content:space-between;align-items:center;gap:20px;min-height:70px;padding:17px 0;border-bottom:1px solid var(--line)}.check:last-child{border:0}.check strong{display:block;font-size:14px;font-weight:550}.check small{display:block;color:var(--muted);font-size:12px;line-height:1.6;margin-top:5px}.split{display:grid;grid-template-columns:1fr 1fr;gap:22px}.split .panel{margin:0}.facts{display:grid;grid-template-columns:1fr auto;gap:15px;font-size:13px;margin:22px 0 8px}.facts dt{color:var(--muted)}.facts dd{margin:0;text-align:right;overflow-wrap:anywhere}.notice{padding:14px 17px;border-radius:10px;background:var(--blue-bg);color:#34466e;font-size:13px;line-height:1.7;margin:20px 0}.steps{display:flex;gap:14px;margin-bottom:25px;flex-wrap:wrap}.step{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:8px}.step span{display:grid;place-items:center;width:23px;height:23px;border:1px solid var(--line);border-radius:50%;background:white}.step.current{color:var(--ink);font-weight:600}.step.current span{background:var(--ink);color:white;border-color:var(--ink)}.form-panel{max-width:680px}.form-intro{margin-bottom:26px}.field{display:grid;gap:9px;margin-bottom:20px;font-size:13px;font-weight:550}.field input,.field select{width:100%;min-height:46px;padding:11px 13px;border:1px solid #cfd5df;border-radius:9px;background:white;color:var(--ink);font-weight:400}.field small{color:var(--muted);font-weight:400;line-height:1.6}.form-foot{display:flex;justify-content:space-between;gap:15px;border-top:1px solid var(--line);padding-top:24px;margin-top:28px}.form-foot .btn:only-child{margin-left:auto}details{margin-top:22px;border-top:1px solid var(--line);padding-top:18px}summary{cursor:pointer;min-height:44px;padding:10px 0;font-size:13px;color:var(--muted)}details p,details li{font-size:13px;line-height:1.8;color:var(--muted)}details ul{padding-left:19px}.empty{padding:30px 4px;color:var(--muted);font-size:14px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:14px 20px;border-radius:12px;font-size:13px;line-height:1.6;z-index:25;max-width:calc(100vw - 32px);box-shadow:0 6px 30px #0f172922}.footnote{font-size:11px;color:var(--muted);margin-top:26px;line-height:1.7}.settings-row{padding:18px 0;border-bottom:1px solid var(--line)}.settings-row:last-child{border:0}.settings-row p{margin-top:7px;font-size:13px;line-height:1.7;color:var(--muted)}[hidden]{display:none!important}
@media(max-width:760px){.demo{font-size:11px;padding:8px 12px}.rail{position:static;width:auto;padding:17px 18px 11px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:0 4px}.brand strong{font-size:18px}.mark{width:29px;height:32px;font-size:24px}.brand small{font-size:10px}.nav{display:flex;gap:5px;margin-top:20px}.nav button{flex:1;justify-content:center;padding:9px 7px;font-size:12px;gap:7px;min-height:44px}.nav svg{width:16px;height:16px}.rail-foot{display:none}main{margin:0;padding:29px 20px 40px}.head{margin:19px 0 25px;align-items:flex-start;flex-wrap:wrap}h1{font-size:33px}.head .btn{min-height:44px}.panel{padding:21px;border-radius:15px}.hero{padding:25px}.hero h2{font-size:24px}.customer{grid-template-columns:minmax(100px,1fr) auto 10px;gap:10px;padding:19px 1px}.customer .note{display:none}.customer strong{font-size:13px}.customer .tag{font-size:11px;max-width:145px}.split{grid-template-columns:1fr}.summary-line{gap:18px;margin:22px 0 30px;font-size:12px}.summary-line strong{font-size:18px}.check{align-items:flex-start;gap:14px}.check .tag{max-width:140px;flex-shrink:0;font-size:11px}.check small{max-width:27ch}.section-head .link{font-size:12px}.facts{grid-template-columns:1fr;gap:8px}.facts dd{text-align:left;margin-bottom:10px}.toast{left:16px;right:16px;transform:none;bottom:16px}.steps{gap:10px}.step{font-size:11px}}
@media(prefers-reduced-motion:no-preference){button{transition:background .12s ease}}
</style>
</head>
<body>
<a class="skip" href="#content">Zum Inhalt</a>
<div class="demo">Entwurf · Fiktive Beispieldaten · Keine Verbindung zum Betrieb</div>
<aside class="rail" aria-label="Verwaltung">
  <div class="brand"><span class="mark" aria-hidden="true">h</span><div><strong>helmut</strong><small>Verwaltung</small></div></div>
  <nav class="nav" aria-label="Hauptnavigation">
    <button type="button" data-nav="overview"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Übersicht</button>
    <button type="button" data-nav="customers"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="8" r="3.5"/><path d="M2 21v-3a7 7 0 0 1 14 0v3M17 5a3.5 3.5 0 0 1 0 7M22 21v-3a6 6 0 0 0-3-5"/></svg>Kunden</button>
    <button type="button" data-nav="settings"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="white"/><circle cx="16" cy="12" r="2" fill="white"/><circle cx="8" cy="18" r="2" fill="white"/></svg>Einstellungen</button>
  </nav>
  <p class="rail-foot">Ein Ort für deine Kunden.<br>Details, wenn du sie brauchst.</p>
</aside>
<main id="content"></main>
<div id="announcement" role="status" aria-live="polite"></div>
<script>
"use strict";
// Ausschließlich flüchtiger Entwurfszustand. Kein API-Client, kein Browser-Speicher.
const customers = [
  {id:"nord",name:"Beispielbüro Nord",person:"Synthetische Person A",email:"nord@example.invalid",parliament:"Bundestag",region:"Beispielregion Nord",topic:"Beispielthema",kind:"delayed"},
  {id:"mitte",name:"Beispielbüro Mitte",person:"Synthetische Person B",email:"mitte@example.invalid",parliament:"Landtag",state:"Berlin",region:"Beispielregion Mitte",topic:"Beispielthema",kind:"current"},
  {id:"sued",name:"Beispielbüro Süd",person:"Synthetische Person C",email:"sued@example.invalid",parliament:"Bundestag",region:"",topic:"",kind:"setup"},
  {id:"west",name:"Beispielbüro West",person:"Synthetische Person D",email:"west@example.invalid",parliament:"Bundestag",region:"Beispielregion West",topic:"Beispielthema",kind:"unknown"}
];
const states = {
 delayed:{label:"Briefing fehlt",tone:"bad",title:"Das heutige Briefing fehlt.",body:"Für heute liegt in diesem Beispiel kein gespeichertes Morgenpaket vor. Die Ursache ist noch nicht bestätigt.",next:"Versorgungsdetails ansehen"},
 current:{label:"Technisch aktuell",tone:"ok",title:"Die heutigen Inhalte sind bereit.",body:"Briefing, Lage und Bereitstellung sind in diesem Beispiel technisch nachgewiesen. Die inhaltliche Beurteilung ist offen.",next:"Versorgungsdetails ansehen"},
 setup:{label:"Einrichtung offen",tone:"warn",title:"Dieser Kunde ist noch in Einrichtung.",body:"Ergänze das Mandatsprofil. Anschließend prüfen wir die Versorgung. Der Zugang bleibt bis zur bewussten Freigabe gesperrt.",next:"Einrichtung fortsetzen"},
 unknown:{label:"Noch nicht geprüft",tone:"",title:"Der aktuelle Zustand ist offen.",body:"Es liegen in diesem Beispiel keine bestätigten aktuellen Prüfwerte vor. Daraus lässt sich keine Aussage zur Versorgung ableiten.",next:"Versorgungsdetails ansehen"}
};
let page="overview",selected="nord",step=0,query="",draft={name:"",person:"",email:"",parliament:"Bundestag",state:"",region:"",topic:""},toastTimer;
const root=document.querySelector("main");
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tag=(label,tone="")=>`<span class="tag ${tone}">${esc(label)}</span>`;
const btn=(label,action,primary=false)=>`<button type="button" class="btn${primary?" primary":""}" data-action="${esc(action)}">${esc(label)}</button>`;
const title=(label,sub,action="")=>`<div class="head"><div><h1 tabindex="-1">${esc(label)}</h1>${sub?`<p class="sub">${esc(sub)}</p>`:""}</div>${action}</div>`;
function announce(message){const el=document.querySelector("#announcement");clearTimeout(toastTimer);el.className="toast";el.textContent=message;toastTimer=setTimeout(()=>{el.className="";el.textContent="";},7000);}
function go(next,id){page=next;if(id)selected=id;render();root.querySelector("h1")?.focus();window.scrollTo(0,0);}
function row(c){const s=states[c.kind];return `<button type="button" class="customer" data-customer="${esc(c.id)}"><span><strong>${esc(c.name)}</strong><small>${esc(c.parliament)}${c.state?" · "+esc(c.state):""}</small></span><span class="note">${c.kind==="current"?"Letzter Nachweis heute, 07:12":c.kind==="delayed"?"Letzter Nachweis gestern, 07:10":c.kind==="setup"?"Profilangaben ergänzen":"Keine aktuellen Prüfwerte"}</span>${tag(s.label,s.tone)}<span class="arrow" aria-hidden="true">›</span></button>`;}
function renderOverview(){const attention=customers.find(c=>c.kind==="delayed");return `<p class="eyebrow">Dein Betrieb</p>${title("Was braucht dich heute?","Kunden und Versorgung auf einen Blick.",btn("+ Kunde anlegen","new",true))}${attention?`<section class="panel hero" aria-label="Handlungsbedarf">${tag("Braucht Aufmerksamkeit","bad")}<h2>Ein Briefing fehlt.</h2><p class="sub">${esc(attention.name)} hat für heute noch kein bestätigtes Morgenpaket. Öffne den Kunden für den letzten bekannten Stand.</p><button type="button" class="btn primary" data-customer="${esc(attention.id)}">Kunden ansehen <span aria-hidden="true">→</span></button></section>`:""}<div class="summary-line"><span><strong>${customers.length}</strong>Kunden im Entwurf</span><span><strong>${customers.filter(c=>c.kind==="setup").length}</strong>Einrichtung offen</span><span><strong>${customers.filter(c=>c.kind==="unknown").length}</strong>noch nicht geprüft</span></div><section class="panel"><div class="section-head"><h2>Deine Kunden</h2><button type="button" class="link" data-action="customers">Alle ansehen →</button></div><div class="rows">${customers.map(row).join("")}</div></section><p class="footnote">Alle Namen, Zeiten und Zustände sind fiktive Beispiele für diesen Entwurf.</p>`;}
function customerRows(){const q=query.toLocaleLowerCase("de-DE");return customers.filter(c=>[c.name,c.person,c.email].some(v=>v.toLocaleLowerCase("de-DE").includes(q))).map(row).join("")||'<p class="empty">Keine Kunden gefunden. Versuche einen anderen Suchbegriff.</p>';}
function renderCustomers(){return `<p class="eyebrow">Kunden</p>${title("Deine Kunden.","Öffne einen Kunden, um Einrichtung und Versorgung zu sehen.",btn("+ Kunde anlegen","new",true))}<label class="quiet" for="search">Kunden suchen</label><input id="search" class="search" type="search" placeholder="Name oder E-Mail" value="${esc(query)}"><section class="panel"><div id="customer-rows" class="rows">${customerRows()}</div></section>`;}
function check(label,text,value,tone=""){return `<div class="check"><div><strong>${esc(label)}</strong><small>${esc(text)}</small></div>${tag(value,tone)}</div>`;}
function supply(c){if(c.kind==="current")return check("Briefing","Heute, 07:12 · kein neuer Tagesanlass","Vollständig","ok")+check("Lage","Heute, 07:03 · Text und Quellen vorhanden","Vorhanden","ok")+check("In App bereitgestellt","Passende technische Quittung vorhanden","Nachgewiesen","ok")+check("Inhaltliche Beurteilung","Ein gebundenes Fachurteil liegt noch nicht vor","Offen");if(c.kind==="delayed")return check("Briefing","Für heute kein gespeichertes Paket bestätigt","Fehlt","bad")+check("Lage","Gestern, 07:02 · heutiger Stand nicht bestätigt","Veraltet","warn")+check("In App bereitgestellt","Für das heutige Paket fehlt der Nachweis","Nicht bestätigt")+check("Ursache","Das Ausbleiben ist belegt; der Grund ist noch offen","Noch offen");return check("Briefing",c.kind==="setup"?"Erst nach abgeschlossener Einrichtung prüfen":"Aktuelle Daten nicht bestätigt","Nicht geprüft")+check("Lage","Aktuelle Daten nicht bestätigt","Nicht geprüft")+check("In App bereitgestellt","Kein aktueller Nachweis","Nicht geprüft");}
function renderDetail(){const c=customers.find(c=>c.id===selected),s=states[c.kind];return `<button type="button" class="link back" data-action="customers">← Alle Kunden</button><p class="eyebrow">${esc(c.parliament)}${c.state?" · "+esc(c.state):""}</p>${title(c.name,"")}<section class="panel hero">${tag(s.label,s.tone)}<h2>${esc(s.title)}</h2><p class="sub">${esc(s.body)}</p>${btn(s.next,c.kind==="setup"?"resume":"supply",true)}</section><section class="panel" id="supply" tabindex="-1"><div class="section-head"><h2>Versorgung heute</h2><span class="quiet">Beispieltag · Berlin</span></div><div class="checks">${supply(c)}</div><details><summary>Nachweise und technische Details</summary><p>Hier wären der geprüfte Berliner Tag, der Zeitpunkt der Abfrage, der gespeicherte Ergebnisstand und die dazugehörigen Quittungen sichtbar. Im Entwurf sind alle Angaben fiktiv.</p><p>Die Bereitstellungsquittung belegt weder eine gelesene Nachricht noch eine zugestellte E-Mail. Eine fachliche Beurteilung wird gesondert ausgewiesen.</p></details></section><div class="split"><section class="panel"><h2>Einrichtung</h2><div class="checks">${check("Mandatsprofil",c.kind==="setup"?"Pflichtangaben oder Prüfung fehlen":"Angaben vorhanden; Zugehörigkeit nur im Beispiel angenommen",c.kind==="setup"?"Offen":"Beispiel vollständig",c.kind==="setup"?"warn":"")}${check("Zugang",c.kind==="setup"?"Keine Einladung versendet":"Kontozugang im Beispiel freigegeben",c.kind==="setup"?"Gesperrt":"Freigegeben")}</div>${c.kind==="setup"?'<button class="link" type="button" data-action="resume">Einrichtung fortsetzen →</button>':""}</section><section class="panel"><h2>Kontakt</h2><dl class="facts"><dt>Ansprechpartner</dt><dd>${esc(c.person)}</dd><dt>E-Mail</dt><dd>${esc(c.email)}</dd></dl><details><summary>Profil und Vereinbarung</summary><p>Mandat: ${esc(c.parliament)}${c.state?" · "+esc(c.state):""}<br>Region: ${esc(c.region)||"Noch offen"}<br>Themen: ${esc(c.topic)||"Noch offen"}</p><p>Preis und Vereinbarung bleiben offen. Zugang und Versorgung werden getrennt geführt.</p></details></section></div><p class="footnote">Entwurf: kein Kunde wurde angelegt, aktiviert oder angeschrieben.</p>`;}
function field(key,label,type="text",hint=""){return `<label class="field" for="${key}">${label}<input id="${key}" name="${key}" type="${type}" maxlength="${type==="email"?254:160}" value="${esc(draft[key])}" required>${hint?`<small>${hint}</small>`:""}</label>`;}
function stateSelect(){return `<label class="field" for="state">Bundesland<select name="state" id="state" required><option value="">Bitte wählen</option>${["Baden-Württemberg","Bayern","Berlin","Brandenburg","Bremen","Hamburg","Hessen","Mecklenburg-Vorpommern","Niedersachsen","Nordrhein-Westfalen","Rheinland-Pfalz","Saarland","Sachsen","Sachsen-Anhalt","Schleswig-Holstein","Thüringen"].map(s=>`<option${s===draft.state?" selected":""}>${s}</option>`).join("")}</select><small>Die tatsächliche Versorgung dieses Landes muss später gesondert bestätigt werden.</small></label>`;}
function renderWizard(){const steps=["Kontakt","Mandat","Prüfen"];return `<button type="button" class="link back" data-action="customers">← Zur Kundenliste</button><p class="eyebrow">${draft.id?"Einrichtung fortsetzen":"Neuer Kunde"}</p>${title("Schritt für Schritt.","Erst einrichten. Dann Versorgung und Zugang bewusst prüfen.")}<div class="steps" aria-label="Fortschritt">${steps.map((s,i)=>`<div class="step${i===step?" current":""}"${i===step?' aria-current="step"':""}><span>${i+1}</span>${s}</div>`).join("")}</div><form class="panel form-panel" id="wizard"><div class="form-intro"><h2>${step===0?"Wen möchtest du anlegen?":step===1?"Welches Mandat gehört dazu?":"So geht es anschließend weiter."}</h2><p class="sub">${step===0?"Bitte verwende hier ausschließlich erfundene Angaben.":step===1?"Dieser Entwurf zeigt eine verkürzte Erfassung. Partei und Fraktion sowie die fachliche Eignung müssen vor dem echten Betrieb geprüft werden.":"Die Angaben werden nur vorübergehend in dieser Vorschau übernommen."}</p></div>${step===0?field("name","Kundenname","text","Zum Beispiel: Beispielbüro Ost")+field("person","Ansprechpartner")+field("email","E-Mail","email"):step===1?`<label class="field" for="parliament">Mandat<select id="parliament" name="parliament"><option${draft.parliament==="Bundestag"?" selected":""}>Bundestag</option><option${draft.parliament==="Landtag"?" selected":""}>Landtag</option></select></label><div id="state-field">${draft.parliament==="Landtag"?stateSelect():""}</div>${field("region","Region oder Wahlkreis")}${field("topic","Themen oder Ausschüsse")}`:`<h3>${esc(draft.name)}</h3><p class="sub">${esc(draft.person)} · ${esc(draft.email)}</p><div class="checks">${check("Kontakt","Angaben in dieser Vorschau erfasst","Erfasst")}${check("Mandatsprofil",draft.parliament+(draft.parliament==="Landtag"?" · "+draft.state:"")+" · Zugehörigkeit und Pflichtangaben prüfen","Prüfung offen","warn")}${check("Versorgung","Heutige Inhalte und Bereitstellung anschließend prüfen","Nicht geprüft")}${check("Zugang","Einladung erst nach bewusster Freigabe","Gesperrt")}</div><div class="notice">Nächster Schritt im echten Ablauf: Mandatsprofil vervollständigen und prüfen, danach die Versorgung nachweisen. Es wird hier keine Einladung versendet.</div>`}<div class="form-foot">${step>0?btn("Zurück","prev"):""}<button type="submit" class="btn primary">${step<2?"Weiter":"Im Entwurf übernehmen"}</button></div></form><p class="footnote">Diese Vorschau speichert nichts dauerhaft und führt keine Konto- oder Profiländerung aus.</p>`;}
function renderSettings(){return `<p class="eyebrow">Einstellungen</p>${title("Alles Weitere.","Selten benötigte Funktionen bleiben erreichbar.")}<section class="panel"><div class="settings-row"><h2>Kosten und Vereinbarungen</h2><p>Kostenübersicht für den Betrieb. Preise und Zahlungsstand bleiben beim jeweiligen Kunden.</p></div><div class="settings-row"><h2>Quellen und Abläufe</h2><p>Quellenzustand und letzte Verarbeitung. Betroffene Kunden führen direkt zu den passenden Details.</p></div><details><summary>Erweiterte Werkzeuge</summary><p>Bestehende Diagnose-, Sicherheits- und Wiederherstellungsfunktionen bleiben erhalten. Der spätere Umbau übernimmt ihre vorhandenen Schutzabfragen.</p><ul><li>Systemdiagnose und Konfiguration</li><li>Audit und Prozessdetails</li><li>Recovery, Backfills und Testbriefing</li><li>Konten und Zuweisungen, soweit noch nicht im Kundenkontext übernommen</li></ul><p>Diese Vorschau enthält keine Verbindung zu diesen Werkzeugen.</p></details></section><p class="quiet">Datenschutzexport und Löschung gehören zum jeweiligen Kunden und bleiben bewusste Einzelaktionen.</p>`;}
function render(){document.querySelectorAll("[data-nav]").forEach(el=>{const active=el.dataset.nav===(page==="detail"||page==="new"?"customers":page);if(active)el.setAttribute("aria-current","page");else el.removeAttribute("aria-current");});root.innerHTML=page==="overview"?renderOverview():page==="customers"?renderCustomers():page==="detail"?renderDetail():page==="new"?renderWizard():renderSettings();}
document.addEventListener("click",event=>{const nav=event.target.closest("[data-nav]");if(nav){go(nav.dataset.nav);return;}const customer=event.target.closest("[data-customer]");if(customer){go("detail",customer.dataset.customer);return;}const action=event.target.closest("[data-action]")?.dataset.action;if(!action)return;if(action==="new"){step=0;draft={name:"",person:"",email:"",parliament:"Bundestag",state:"",region:"",topic:""};go("new");}else if(action==="prev"){step--;render();root.querySelector("h1")?.focus();}else if(action==="resume"){draft={...customers.find(c=>c.id===selected)};step=1;go("new");}else if(action==="supply"){const el=document.querySelector("#supply");el.scrollIntoView({block:"start"});el.focus();}else go(action);});
document.addEventListener("input",event=>{if(event.target.id==="search"){query=event.target.value;document.querySelector("#customer-rows").innerHTML=customerRows();}else if(event.target.closest("#wizard")&&Object.hasOwn(draft,event.target.name)){draft[event.target.name]=event.target.value;}});
document.addEventListener("change",event=>{if(event.target.id==="parliament"){draft.parliament=event.target.value;document.querySelector("#state-field").innerHTML=draft.parliament==="Landtag"?stateSelect():"";}});
document.addEventListener("submit",event=>{if(event.target.id!=="wizard")return;event.preventDefault();for(const input of event.target.querySelectorAll("input[required]"))input.value=input.value.trim();if(!event.target.reportValidity())return;for(const [key,value]of new FormData(event.target))draft[key]=String(value).trim();if(step<2){step++;render();root.querySelector("h1")?.focus();return;}const existing=customers.find(c=>c.id===draft.id);if(existing)Object.assign(existing,draft,{kind:"setup"});else customers.push({...draft,id:"entwurf-"+customers.length,kind:"setup"});selected=existing?.id||customers.at(-1).id;go("detail");announce("In dieser Vorschau übernommen. Profilprüfung und Versorgung bleiben offen. Kein echtes Konto und keine Einladung erstellt.");});
render();
</script>
</body>
</html>
