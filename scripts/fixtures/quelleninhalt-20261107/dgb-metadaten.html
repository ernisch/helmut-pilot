<meta property="og:title" content="Dritte Tarifrunde im Gebäudereiniger-Handwerk endet ohne Ergebnis">
<meta property="og:description" content="Die dritte Tarifrunde im Gebäudereiniger-Handwerk ist ohne Ergebnis zu Ende gegangen. Die IG BAU hält das neue Arbeitgeber-Angebot für völlig inakzeptabel und zeigt sich kampfbereit. Der aktuelle Tarifvertrag läuft Ende Dezember aus, die Friedenspflicht endet am 31. Dezember.">
